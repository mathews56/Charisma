nothing until she speaks first"], "a": 1, "why": "A context-based opener with your name is friendly and easy to respond to. Comments on looks and personal questions make most people uncomfortable."}, {"q": "The interview panel says, “Tell us about yourself.” What is the best approach?", "o": ["Start from your birthplace and go through each school", "Name and role, two or three strengths matched to the job, then your goal here", "“It’s all in my CV.”", "Talk about your hobbies only"], "a": 1, "why": "Panels want to know whether you fit the role. Evidence matched to the job, in under 90 seconds, answers that."}, {"q": "At a staff briefing on your first day, which line works best?", "o": ["“I’ve come to bring change to this department.”", "“I’m still learning how things run here, and I’m happy to help with drama.”", "“At my last school we did it better.”", "“I’m not good at speaking.”"], "a": 1, "why": "Humility plus an offer of help wins colleagues over. Arriving as the “fixer” puts them on guard."}], "drill": "Write your introduction in three versions: stranger (10 seconds), 30 seconds and 2 minutes. Record them and check that your name comes out clearly.", "mission": "Introduce yourself to one person you have seen many times but never spoken to properly. End with a question back to them."}, "17": {"title": "Speaking to a mixed audience", "min": 15, "idea": ["Church services, <span lang=\"sw\">harambees<\/span>, weddings, prize-giving days and funerals bring together people who rarely sit in one room: elders and youth, officials and farmers, people who prefer English and people who prefer <span lang=\"sw\">Kiswahili<\/span> or their mother tongue.", "A good speech makes every one of them feel spoken to. A poor one speaks only to the VIP table, or only to the speaker’s friends."], "deep": ["Mixed audiences listen for respect before content. Elders notice whether protocol was observed. Ordinary guests notice whether you spoke to them or past them. Young people notice whether you are boring.", "You can’t give each group a separate speech, but you can give each group <b>one line<\/b> that is clearly for them, then carry everyone with <b>one message<\/b> and <b>one story<\/b> that everybody can relate to.", "Time is the hidden test. At most Kenyan functions the programme is already running late. The speaker who is brief, clear and warm is the one people thank afterwards."], "mistakes": ["Reading a long protocol list and using up half your time on it.", "Speaking only to the dignitaries, or only to your own group.", "Using jargon, acronyms or inside jokes that half the room doesn’t get.", "Bringing politics, family disputes or old grudges to a wedding, church or funeral.", "Going over your time because “I’ll just add one thing.”", "Using a language part of the room doesn’t understand, with no translation."], "src": [], "tech": {"name": "The 5-part mixed-audience speech", "steps": ["<b>Protocol:<\/b> name the most senior guests by title, then say “Protocol observed.” Three or four names at most.", "<b>Connection:<\/b> who you are and how you are linked to the occasion, in one sentence.", "<b>One line per group:<\/b> parents, elders, youth, hosts, guests. Each should hear something meant for them.", "<b>One message and one story:<\/b> the single thing you want everyone to remember, plus a short story that carries it.", "<b>Close:<\/b> a clear ending suited to the occasion, such as thanks, a blessing, a toast or a call to action."]}, "more": {"label": "By occasion", "h": "Adjusting by occasion", "blocks": [{"table": {"cols": ["Occasion", "Tone", "Do", "Avoid"], "rows": [["Church", "Humble, grateful", "Acknowledge the pastor and congregation; a short scripture if it fits", "Taking over the sermon; going over time"], ["<span lang=\"sw\">Harambee<\/span>", "Warm, purposeful", "Thank donors, state the target clearly, give first yourself", "Shaming people who give less; politics"], ["Wedding", "Joyful, affectionate", "Honour the couple and both families; clean humour", "Stories about exes; drunken jokes; long speeches"], ["Prize-giving, graduation", "Inspiring", "Celebrate the winners and encourage everyone else", "Speaking only to the top students"], ["Funeral", "Gentle, respectful", "Comfort the family; one good memory of the person", "Disputes, inheritance, politics, blame"]]}}, {"p": ["<b>Language:<\/b> use simple English or <span lang=\"sw\">Kiswahili<\/span>. If part of the room speaks another language, add a key line in it, or ask for a translator and speak in short sentences with pauses."]}]}, "ke": [{"t": "Church", "x": "Youth Sunday, five minutes: “Praise the Lord. Pastor, church elders, brothers and sisters, protocol observed. My name is John <span lang=\"sw\">Karani<\/span>. I grew up in this church, in the Sunday school class at the back. To our parents: thank you for every Sunday you brought us here, even when we complained. To the youth: this church has a seat for you, not just at the back. Let me tell you about the morning <span lang=\"sw\">Mama Mutua<\/span> stopped me at the gate…”"}, {"t": "<span lang=\"sw\">Harambee<\/span>", "x": "Fundraising for a student’s university fees: “Chairman of the committee, our area chief, family and friends, protocol observed. I’m John, Kevin’s teacher in Form 4. Kevin scored an A minus despite studying by lamp at home. Today our target is 180,000 shillings for his first year. I’m starting with 5,000. Every shilling counts, whether it’s fifty or five thousand. Kevin’s future is in this tent today.”"}, {"t": "Wedding", "x": "As friend of the groom: “The families of the bride and the groom, our pastor, honoured guests, protocol observed. I’m John, and Brian and I shared a desk in Form 1. To Grace’s family: you are gaining a man who once walked six kilometres to return my lost wallet. Grace, that is the man you are getting. Please raise your glasses, or your sodas, to Brian and Grace.”"}, {"t": "Prize-giving day", "x": "Chief, MCA, BOM chair, parents, teachers, students: “Protocol observed. I’m John <span lang=\"sw\">Karani<\/span>, the new English teacher. To our parents: thank you for trusting us with your children. To my colleagues: thank you for welcoming me. To the students: today is about you. In Form 2 I won nothing on prize-giving day. I sat where some of you are sitting, clapping for others. Two years later I was on this stage. If your name isn’t called today, your story isn’t finished.”"}, {"t": "Funeral", "x": "Tribute to a colleague: “To the family of the late Mr. <span lang=\"sw\">Kiptoo<\/span>, our principal, colleagues and friends, protocol observed. I’m John, and I taught beside Mr. <span lang=\"sw\">Kiptoo<\/span> for three years. To his family: we share your loss, and we are here for you. He never let a student leave his class believing they couldn’t do Maths. That is how this school will remember him. May his family find comfort.”"}], "quiz": [{"q": "You are asked to speak at a <span lang=\"sw\">harambee<\/span>. What is the strongest way to encourage giving?", "o": ["Name the people who haven’t contributed yet", "State the target clearly, explain who it helps, and give first yourself", "Speak for 20 minutes before mentioning money", "Compare it with another family’s <span lang=\"sw\">harambee<\/span>"], "a": 1, "why": "A clear target, a human reason and your own example motivate people. Shaming backfires."}, {"q": "There are 15 dignitaries at a prize-giving day. How should you handle protocol?", "o": ["Read out every name and title", "Skip protocol entirely", "Name the two or three most senior guests, then say “Protocol observed”", "Greet only the students"], "a": 2, "why": "Brief protocol shows respect without using up your time."}, {"q": "At a wedding, which story is best for the groom’s friend to tell?", "o": ["How many girlfriends he had in campus", "The time he got drunk at a party", "A short story that shows his good character", "An inside joke only your friends understand"], "a": 2, "why": "Elders, both families and children are listening. A story that honours the groom works for everyone in the room."}], "drill": "Pick one occasion from the table. Write a 2-minute speech using the five parts. Time it, and cut it until it fits.", "mission": "At your next church service, function or meeting, watch one speaker. Note which groups they spoke to, which they forgot, and how long their protocol took."}, "18": {"title": "When someone sees you as a threat, or misreads you", "min": 15, "idea": ["Sometimes the problem isn’t what you said but how someone sees you. A colleague thinks you are after their position. A senior teacher feels you are showing them up. A woman thinks your friendliness means romantic interest, or that you are using her.", "Arguing with the label rarely works. What works is lowering the threat and making your intentions clear, kindly and consistently."], "deep": ["People who feel threatened protect their status. They defend, compete or withdraw, and they read even your good actions as moves against them. Give them reassurance about their place, and the defensiveness drops.", "A misread intention is different: it is confusion, not rivalry. Confusion grows when it is left unspoken and people start guessing. One clear, calm conversation usually settles what weeks of hints can’t."], "mistakes": ["Competing harder to “prove” yourself, which confirms you are a threat.", "Gossiping about the person to others.", "Avoiding them completely, which looks like guilt or hostility.", "Over-explaining or apologising repeatedly when someone misreads your interest.", "Treating one colleague more warmly than everyone else, then being surprised it is misread.", "Meeting a student alone, behind closed doors, for any reason."], "src": [], "tech": {"name": "Technique A: lower the threat", "steps": ["<b>Honour their place:<\/b> acknowledge their experience out loud. “You’ve taught this set book for ten years. How do you handle the drama questions?”", "<b>Ask for advice:<\/b> asking someone for help turns them from rival to mentor.", "<b>Share credit publicly:<\/b> “The idea came from Mr. <span lang=\"sw\">Otieno<\/span>’s suggestion last term.”", "<b>Clarify your lane:<\/b> “I’m focusing on Form 2 drama. The senior classes are yours.”", "<b>If it continues, name it privately:<\/b> “I sense some tension between us, and I’d like us to work well together. Have I done something that bothered you?”"]}, "more": {"label": "Misread intentions", "h": "Technique B: clear up a misread intention", "blocks": [{"steps": ["<b>Say it once, plainly and kindly:<\/b> “I value working with you, and I want to be clear that I see you as a colleague. If anything I did gave a different impression, I’m sorry for the confusion.”", "<b>Don’t over-explain.<\/b> One clear statement is believed; a long defence sounds guilty.", "<b>Stay consistent:<\/b> treat her exactly as you treat other colleagues. Don’t go cold, and don’t go extra warm.", "<b>Keep things visible:<\/b> meet in the staffroom or with others present, and keep messages work-related and in daylight hours.", "<b>If she feels used<\/b> (“You only talk to me when you need help”): acknowledge it, rebalance, and offer help in return."]}, {"h": "With students: safeguarding first", "p": ["If a student seems to misread your attention, or you sense a crush:"], "bullets": ["Never meet alone in a closed room. Keep the door open, or have another student or teacher present.", "Don’t exchange private messages or social-media chats.", "Inform the guidance and counselling teacher or the senior woman teacher early, and make a short written note.", "Stay kind and normal in class. Don’t embarrass or single out the student."]}, {"p": ["Reporting early protects the student, and it protects you."]}]}, "ke": [{"t": "The rival colleague", "x": "John’s Form 2 English results beat those of Mr. <span lang=\"sw\">Otieno<\/span>, a senior teacher in the same department, and Mr. <span lang=\"sw\">Otieno<\/span> has gone cold. John asks for his help with set-book revision, credits him at the department meeting and offers to co-run the composition clinic. Within a month, Mr. <span lang=\"sw\">Otieno<\/span> is introducing John as “my partner in English.”"}, {"t": "The “enemy” deputy", "x": "The deputy questions every request John makes. John meets her privately: “I get the sense my requests are adding to your workload. What’s the best way for me to bring things to you?” She explains that she prefers written requests on Mondays. The tension eases."}, {"t": "The colleague who misreads friendliness", "x": "John often shares lunch with Ms. <span lang=\"sw\">Wairimu<\/span> and helps her with her laptop. She starts sending late-night messages. John replies the next morning: “Thanks, <span lang=\"sw\">Wairimu<\/span>. I enjoy working with you, and I want to be clear I see you as a good colleague and friend. Let’s keep our chats to work hours.” He keeps eating lunch at the staff table, with everyone."}, {"t": "The woman who feels used", "x": "A colleague says, “You only greet me when you want my projector.” John says: “You’re right, and I’m sorry. I’ve been taking more than I give. Let me help with your Form 4 marking this weekend.”"}], "quiz": [{"q": "A senior colleague sees you as competition after your good results. What is the best first move?", "o": ["Post your results on the staff noticeboard", "Ask for his advice and credit his input publicly", "Avoid him completely", "Complain to the principal"], "a": 1, "why": "Asking for advice and sharing credit lowers his sense of threat and turns rivalry into partnership."}, {"q": "A colleague seems to think you are romantically interested. What should you do?", "o": ["Stop greeting her", "Explain at length over several conversations", "Clarify once, kindly, then treat her like every other colleague", "Ignore it and hope it passes"], "a": 2, "why": "One clear statement plus consistent behaviour ends the confusion without hurting the working relationship."}, {"q": "A Form 3 student keeps staying behind to “ask questions” and seems attached to you. What is right?", "o": ["Meet her alone in the staffroom after class", "Keep meetings public or with the door open, and inform the guidance and counselling teacher early", "Give her your number so she can ask questions later", "Embarrass her in class so she stops"], "a": 1, "why": "Safeguarding protects the student and you. Early reporting and open settings are the professional standard."}], "drill": "Think of one person who sees you as a threat or rival. Write down one way to honour their place, one way to ask for their advice, and one way to share credit.", "mission": "This week, publicly credit a colleague’s idea or effort in a meeting."}, "19": {"title": "Drawing out quiet people", "min": 15, "idea": ["Quiet doesn’t mean empty. Some people are introverts who think before they speak. Some are shy and afraid of being wrong. Some fear being laughed at, and some lack confidence in English.", "In most rooms, a few loud voices do all the talking while the quiet ones keep their best ideas to themselves. A skilled communicator makes it safe and easy for them to speak."], "deep": ["<b>Introversion is not the same as shyness.<\/b> An introvert may be confident but needs time to think, and fast-paced discussion shuts them out. A shy person wants to speak but fears the judgment. Both open up when you slow down and lower the risk.", "<b>Wait time matters.<\/b> Researcher Mary Budd Rowe found that teachers typically wait about one second after asking a question before answering it themselves or picking someone else. When teachers waited three seconds or more, more students answered, their answers were longer and better reasoned, and quieter students joined in.", "<b>Thinking first helps.<\/b> When people get a chance to think or write before speaking, the quality of contributions rises, especially from those who process internally."], "mistakes": ["Asking “Any questions?” and moving on after one second.", "Calling on a quiet student without warning, which leaves them embarrassed in front of the class.", "Praising only the fast, loud answers.", "Laughing at, or letting others laugh at, a wrong answer.", "Labelling them out loud: “Why are you always so quiet?”"], "src": [["Kent State on wait time (Rowe)", "https://www.kent.edu/ctl/wait-time-making-space-authentic-learning"]], "tech": {"name": "Safe, slow, small", "steps": ["<b>Slow down:<\/b> after a question, silently count to five before taking an answer.", "<b>Think, pair, share:<\/b> think alone for 1 minute, discuss with a neighbour for 2 minutes, then pairs share. Speaking to one person first is much easier.", "<b>Write before speaking:<\/b> give everyone 60 seconds to write an answer, then invite a few to read theirs.", "<b>Warn before calling:<\/b> “<span lang=\"sw\">Achieng<\/span>, I’ll come to you after Brian.” This gives her time to prepare.", "<b>Start small:<\/b> begin with low-risk questions (opinions, experiences) before right-or-wrong ones.", "<b>Protect wrong answers:<\/b> “Good thinking. Who can build on that?” Never let the class laugh.", "<b>Talk privately:<\/b> a quiet “I liked your point in your essay. Would you share it tomorrow?” often opens the door."]}, "more": {"label": "With adults", "h": "Quiet adults", "blocks": [{"p": ["In meetings and staffrooms, the same rules apply with small changes:"], "bullets": ["Send the agenda early so thinkers can prepare.", "Ask for written input before the discussion.", "Use small groups or pairs before the full meeting.", "Invite quieter members directly and kindly: “Mr. <span lang=\"sw\">Kiprop<\/span>, we haven’t heard your view yet.”"]}]}, "ke": [{"t": "A silent Form 1 class", "x": "John asks Form 1 East, “What makes a good friend?” Silence. He says: “Write one sentence. One minute.” Then: “Share with your neighbour.” Then: “Who heard a great answer from their partner?” Ten hands go up, many praising their quiet neighbour."}, {"t": "The student who never speaks", "x": "<span lang=\"sw\">Wanjiru<\/span> writes brilliant compositions but never talks. After class John says: “Your essay on the drought was the best in the class. Would you read the first paragraph tomorrow?” She agrees, reads, and the class claps. The next week she raises her hand."}, {"t": "English anxiety", "x": "A student from a rural primary school understands but fears speaking English. John lets the class discuss in <span lang=\"sw\">Kiswahili<\/span> first, then report back in English: “Say it in <span lang=\"sw\">Kiswahili<\/span>, then let’s find the English together.”"}, {"t": "Staff meeting", "x": "Several younger teachers never speak. The HOD starts collecting ideas on slips of paper before the discussion and reads them out without names. The best idea of the term comes from the quietest teacher."}], "quiz": [{"q": "Mary Budd Rowe found that waiting at least how long after a question led to more and better answers?", "o": ["Half a second", "One second", "Three seconds or more", "One minute"], "a": 2, "why": "Teachers typically waited about one second. Extending wait time to three seconds or more brought in more students and longer, better reasoned answers."}, {"q": "A quiet student rarely answers. What is the best approach?", "o": ["Call on her without warning to force participation", "Leave her alone for the whole term", "Warn her you’ll come to her next, after giving thinking time", "Ask her loudly why she’s so quiet"], "a": 2, "why": "A warning plus thinking time lets her prepare, which greatly reduces the fear of being caught out."}, {"q": "A student gives a wrong answer and the class laughs. What do you say?", "o": ["Laugh along to keep the mood light", "Stop the laughter, value the attempt, and invite others to build on it", "“That’s wrong. Next.”", "Punish the student for not studying"], "a": 1, "why": "Protecting wrong answers keeps everyone willing to try. One embarrassing moment can silence a student for a whole term."}], "drill": "Prepare one lesson or meeting using think–pair–share and a five-second wait after each question.", "mission": "Have a short private conversation with one quiet student or colleague, praising something specific they did."}, "20": {"title": "Making hard ideas easy", "min": 15, "idea": ["Some learners find abstract or complex ideas hard. That isn’t the end of the story. Most struggle because the idea was presented too fast, too abstractly, or with too many new pieces at once.", "The skill is to build the idea from what the learner already knows, one step at a time."], "deep": ["<b>Expectations shape results.<\/b> In the famous “Pygmalion” study (Rosenthal and Jacobson, 1968), teachers were told some randomly chosen students were about to “bloom.” Those students showed greater gains, especially in the younger classes. Later researchers debated how large the effect is, but the lesson holds: when teachers believe a learner can grow, they give more time, more feedback and warmer encouragement, and learners respond.", "<b>Working memory is small.<\/b> People can hold only a few new pieces of information in mind at once. Pour in ten new terms and the learner drops most of them. Introduce one idea, practise it, then add the next.", "<b>Concrete before abstract.<\/b> We understand new things by connecting them to things we already know. A familiar example first makes the rule easy to grasp afterwards."], "mistakes": ["Labelling learners “slow” or “dull,” even silently.", "Defining a term before giving any example.", "Introducing several new ideas in one go.", "Asking “Do you understand?” Everyone says yes.", "Repeating the same explanation louder instead of trying a new one."], "src": [["Expectancy effects (Pygmalion study)", "https://www.psywww.com/intropsych/ch15-social/expectancy.html"]], "tech": {"name": "Start from what they know", "steps": ["<b>Find the anchor:<\/b> what do they already know that is like this idea? Start there.", "<b>One idea at a time:<\/b> break it into small steps and teach the first fully before the next.", "<b>Example first, rule second:<\/b> show it, then name it.", "<b>I do, we do, you do:<\/b> you demonstrate, you do one together, then they try alone.", "<b>Check with “show me”:<\/b> “Show me with your own example” or “Explain it to your neighbour” reveals real understanding.", "<b>Explain differently, not louder:<\/b> if one explanation fails, try a picture, a story, an object or a different example."]}, "more": {"label": "Kenyan analogies", "h": "Kenyan analogies that work", "blocks": [{"table": {"cols": ["Idea", "Anchor"], "rows": [["Electric current", "Water flowing through a pipe from a tank"], ["Fractions", "Sharing a <span lang=\"sw\">chapati<\/span> among family members"], ["Supply and demand", "Tomato prices at the market in rainy and dry seasons"], ["Photosynthesis", "The leaf as a kitchen: sunlight is the <span lang=\"sw\">jiko<\/span>, water and air are the ingredients, sugar is the food"], ["Metaphor (English)", "Calling someone “a lion” in a praise song"], ["The immune system", "Security guards at the school gate checking visitors"]]}}]}, "ke": [{"t": "Figures of speech", "x": "Form 2 can’t tell a simile from a metaphor. John starts with the <span lang=\"sw\">Kiswahili<\/span> they know: “<span lang=\"sw\">Ana nguvu kama simba<\/span>” (he is strong like a lion) versus “<span lang=\"sw\">Yeye ni simba<\/span>” (he is a lion). Then he names them: one uses “like” or “as” (simile), the other says he <i>is<\/i> one (metaphor). The class gets it in five minutes."}, {"t": "Maths with a struggling learner", "x": "Kevin can’t do percentages. His teacher asks: “If there are 100 bags of maize and 20 are spoiled, how many out of every 100 are spoiled?” “Twenty.” “That’s 20 percent.” Then 50 bags, then 200. Kevin starts working them out himself."}, {"t": "A parents’ meeting on CBC", "x": "Parents are confused by “competency-based curriculum.” The principal says: “In the old system we asked, ‘Can your child remember the answer?’ Now we ask, ‘Can your child do it?’ Like a mechanic: we don’t just ask him to name the parts, we ask him to fix the car.” Heads nod."}], "quiz": [{"q": "What did the Pygmalion study suggest?", "o": ["IQ cannot change", "Teachers’ expectations can affect how much students improve", "Students learn best alone", "Younger students learn more slowly"], "a": 1, "why": "When teachers expected some students to “bloom,” those students gained more. Belief changes how teachers teach."}, {"q": "What is the best check for understanding?", "o": ["“Do you understand?”", "“Any questions?”", "“Explain it to your neighbour using your own example.”", "“Raise your hand if you’re lost.”"], "a": 2, "why": "“Show me” checks reveal real understanding. “Do you understand?” almost always gets a yes, even from confused learners."}, {"q": "You’ve explained osmosis twice and a learner still doesn’t get it. What next?", "o": ["Repeat the same explanation more loudly", "Tell her to read the textbook", "Try a new explanation, such as an everyday anchor or a demonstration", "Move on; she may never get it"], "a": 2, "why": "A different route (an analogy, a picture, a demonstration) often works where repetition fails."}], "drill": "Pick the hardest topic you teach or explain. Write one everyday Kenyan analogy for it and one “show me” question.", "mission": "Teach one concept this week using “I do, we do, you do,” and check with a “show me” question."}, "21": {"title": "Nonverbal hacks: sending and reading signals", "min": 15, "idea": ["Lesson 6 covered your posture, and Lesson 7 covered reading changes in others. This lesson adds practical signals you can <b>send<\/b> to build warmth and authority, and a guide to <b>reading<\/b> common signals, with a warning about how easy they are to misread."], "deep": ["<b>Mirroring builds rapport.<\/b> In the “chameleon effect” studies (Chartrand and Bargh, 1999), people whose posture and gestures were subtly mirrored liked their partner more, and the interaction felt smoother. The key is subtlety. Obvious copying feels like mockery.", "<b>Space sends messages.<\/b> Anthropologist Edward Hall described “zones” of personal space. Too close feels like pressure; too far feels cold. The right distance depends on the relationship, the setting and the culture.", "<b>Real smiles differ from polite ones.<\/b> A genuine smile involves the muscles around the eyes, not just the mouth, and people notice the difference.", "<b>Signals are clues, not proof.<\/b> As Lesson 7 showed, people are poor lie detectors. No single gesture has one fixed meaning."], "mistakes": ["Copying someone’s gestures so obviously that they notice.", "Standing too close to someone you’ve just met.", "Reading one gesture (folded arms, looking away) as proof of a feeling.", "Forgetting that lowered eyes often show respect in Kenyan homes.", "Shouting for silence when stillness would work better."], "src": [["Chartrand & Bargh (1999), Duke", "https://scholars.duke.edu/publication/658197"]], "tech": {"name": "Signals to send", "table": {"cols": ["Hack", "How", "Effect"], "rows": [["Eyebrow flash", "Quick raise of the eyebrows as you greet someone", "Signals friendly recognition"], ["Open palms", "Show your palms when explaining or asking", "Signals honesty and openness"], ["Gentle mirroring", "Match their pace, volume and posture, a few seconds later", "Builds rapport"], ["Pause and point", "Stop, pause, then gesture at the key word on the board", "Directs attention"], ["Lean in to listen", "Lean forward slightly when someone speaks", "Shows interest"], ["Right distance", "About an arm’s length; adjust if they step back", "Comfort without pressure"], ["Respectful touch", "Two-handed handshake for elders, or hold your forearm while shaking", "Shows respect"], ["Punctuality", "Arrive on time; start and end on time", "Says “I respect your time”"], ["Teacher’s stillness", "Stand still at the front and wait in silence", "Authority without shouting"]]}}, "more": {"label": "Reading signals", "h": "Reading signals: possible meanings", "blocks": [{"table": {"cols": ["You see", "It might mean", "It might also mean", "Check with"], "rows": [["Arms folded", "Defensive, closed", "Cold, comfortable, tired", "“What do you think so far?”"], ["Little eye contact", "Discomfort or shyness", "Respect for an elder or teacher", "Watch their baseline"], ["Leaning back", "Disengaged", "Relaxed, thinking", "Ask an open question"], ["Feet pointing to the door", "Wants to leave", "Just shifted position", "“Are you pressed for time?”"], ["Fast nodding", "Wants you to finish", "Strong agreement", "Pause and invite them in"], ["Lips pressed together", "Holding back disagreement", "Concentrating", "“You look like you have a view on this.”"], ["Touching face or neck", "Anxious", "An itch", "Look for a cluster"], ["A quiet “mm” or “eh”", "Doubt", "Polite agreement", "Ask directly but gently"]]}}, {"p": ["<b>The rule:<\/b> look for a <b>cluster<\/b> of three signals and a <b>change from baseline<\/b>, then <b>check by asking<\/b>. Never conclude from one gesture."]}]}, "ke": [{"t": "Quieting a noisy class", "x": "Instead of shouting “Keep quiet!”, John stands still at the front, says nothing, and makes eye contact with the noisiest group. Within 20 seconds the class settles."}, {"t": "Greeting a parent", "x": "At the gate, John gives a parent an eyebrow flash and a smile, offers a two-handed handshake to an elderly grandmother, and walks beside her rather than ahead."}, {"t": "Reading a colleague", "x": "In a meeting, Ms. <span lang=\"sw\">Chebet<\/span> folds her arms, presses her lips together and stops taking notes when the timetable comes up. Three signals together, and a change from her usual note-taking. John says: “Ms. <span lang=\"sw\">Chebet<\/span>, you look like you have a view on this.” She does: the timetable clashes with games."}, {"t": "Reading respect", "x": "A Form 1 student looks down while explaining why he’s late. John doesn’t read this as lying. In many homes, lowering your eyes to an adult is a sign of respect."}], "quiz": [{"q": "In the “chameleon effect” studies, what happened when people were subtly mirrored?", "o": ["They felt mocked", "They liked their partner more and the interaction felt smoother", "They didn’t notice any difference", "They became suspicious"], "a": 1, "why": "Subtle mirroring increased liking. Obvious copying would backfire."}, {"q": "A student avoids eye contact while answering you. What is the safest reading?", "o": ["He’s definitely lying", "It could be respect or shyness; check his usual behaviour", "He’s being rude", "He doesn’t know the answer"], "a": 1, "why": "In many Kenyan homes, lowered eyes show respect to adults. One signal proves nothing."}, {"q": "Your class is noisy. Which nonverbal approach works best?", "o": ["Shout over them", "Bang the table", "Stand still at the front, silent, and make eye contact", "Turn your back and write on the board"], "a": 2, "why": "Calm stillness signals authority. Students notice the silence and settle, without a power struggle."}], "drill": "Practise the eyebrow flash and the open-palm gesture in a mirror until they feel natural.", "mission": "In one conversation, mirror the other person’s pace and volume subtly. In one meeting, spot a cluster of three signals and check it with a question."}}, "capstone": ["Give a 3-minute talk to at least three people (a class, a team meeting, a church or chama group) using PREP, one banked story, deliberate pauses and falling endings.", "Record it. Count your fillers and compare with your Lesson 15 count.", "Ask two listeners for SBI-style feedback: one thing that worked, one thing to change.", "Write a one-page reflection: your three biggest improvements and your next focus."], "reading": [["The Charisma Myth", "Olivia Fox Cabane"], ["Radical Candor", "Kim Scott"], ["Never Split the Difference", "Chris Voss"], ["Crucial Conversations", "Patterson, Grenny, McMillan, Switzler"], ["Talk Like TED", "Carmine Gallo"], ["How to Win Friends and Influence People", "Dale Carnegie"]]}</script><script id="app-js">(function(){

/* ---------- text for the voice ---------- */
/* Kiswahili words are marked <span lang="sw">…</span>; they become \u0001…\u0002 so the voice can switch language. */
function plain(h){return String(h).replace(/<span lang="sw">([\s\S]*?)<\/span>/g,"\u0001$1\u0002").replace(/<[^>]+>/g,"").replace(/\$/g," dollar").replace(/\s+/g," ").trim();}
function tableSpeech(t){var out=[];t.rows.forEach(function(r){out.push(r.map(function(c,i){return (i===0?"":t.cols[i]+": ")+c;}).join(". ")+".");});return out;}
function speechFor(s){
 var x=s.l?L(s.l):null,out=[];
 switch(s.t){
 case "cover":out=["Skill dollar, by Mathew dollar, presents: Unlock your charisma.","A six-week course in "+NL+" lessons. Tap next to begin, or tap any topic to jump to it."];break;
 case "guide":out=["How this course works.","Each lesson has eight or nine slides: the idea, why it works, the technique, Kenyan examples, three practice questions, then a drill and a field mission.","You don’t have to go in order. Tap Topics at the top to jump to any lesson."];break;
 case "module":var m=D.modules[s.m];out=["Module "+(s.m+1)+": "+m.name+". "+m.weeks+".",m.intro,"Lessons: "+m.lessons.map(function(n){return n+", "+L(n).title;}).join("; ")+"."];break;
 case "idea":out=["Lesson "+s.l+": "+x.title+". The idea."].concat(x.idea);break;
 case "deep":out=["Why it works."].concat(x.deep,["Common mistakes to avoid."],x.mistakes);break;
 case "tech":out=["The technique: "+x.tech.name+"."];
  if(x.tech.ba)x.tech.ba.forEach(function(r){out.push(r[0]+". Do: "+r[1]+". Avoid: "+r[2]+".");});
  else if(x.tech.table)out=out.concat(tableSpeech(x.tech.table));
  else x.tech.steps.forEach(function(st,i){out.push((x.tech.bullet?"":"Step "+(i+1)+". ")+st);});break;
 case "more":out=[x.more.h+"."];x.more.blocks.forEach(function(b){if(b.h)out.push(b.h+".");if(b.card){out.push(b.card.t+".");out.push(b.card.x);}if(b.p)out=out.concat(b.p);if(b.steps)out=out.concat(b.steps);if(b.bullets)out=out.concat(b.bullets);if(b.table)out=out.concat(tableSpeech(b.table));});break;
 case "ke":out=["What it looks like here in Kenya."];x.ke.forEach(function(k){out.push(k.t+".");out.push(k.x);});break;
 case "quiz":var Q=x.quiz[s.q],a=S.ans[qid(s.l,s.q)];
  if(a!==undefined&&a!==null)out=feedbackSpeech(s);
  else{out=["Question "+(s.q+1)+". "+Q.q];Q.o.forEach(function(o,k){out.push("Option "+"ABCD"[k]+": "+o);});out.push("Tap your answer.");}break;
 case "practice":out=["Put it to work.","Drill, on your own: "+x.drill,"Field mission, with people: "+x.mission];break;
 case "capstone":out=["Capstone. Prove it in one real performance."].concat(D.capstone);break;
 case "sources":out=["Further reading."].concat(D.reading.map(function(r){return r[0]+", by "+r[1]+".";}));break;
 }
 return out.map(plain);
}
function feedbackSpeech(s){var Q=L(s.l).quiz[s.q],id=qid(s.l,s.q),a=S.ans[id];
 if(a===Q.a)return [plain(cheer(id)),plain(Q.why)];
 return ["Not quite.",plain("The correct answer is "+"ABCD"[Q.a]+": "+Q.o[Q.a]+"."),plain(Q.why)];}

/* ---------- voice engine ---------- */
var synth=("speechSynthesis" in window)?window.speechSynthesis:null;
var VQ=[],VI=0,VK=0,speaking=false,allVoices=[],badVoices={};
function loadVoices(){if(!synth)return;allVoices=synth.getVoices()||[];}
if(synth){loadVoices();if(synth.addEventListener)synth.addEventListener("voiceschanged",loadVoices);else synth.onvoiceschanged=loadVoices;}
function isEn(v){return /^en/i.test(v.lang);} function isSw(v){return /^sw/i.test(v.lang);}
function quality(v){var n=v.name||"",s=0;
 if(/natural|neural|online|enhanced|premium|wavenet|studio/i.test(n))s+=6;
 if(/google/i.test(n))s+=3;
 if(v.localService===false)s+=3;
 if(/compact|espeak|robot/i.test(n))s-=6;
 var l=(v.lang||"").replace("_","-");
 s+={"en-KE":4,"en-GB":3,"en-NG":2,"en-ZA":2,"en-IN":1,"en-US":1}[l]||0;
 return s;}
function sortedVoices(test){return allVoices.filter(test).filter(function(v){return !badVoices[v.name];}).sort(function(a,b){return quality(b)-quality(a);});}
function enVoice(){if(!allVoices.length)loadVoices();var list=sortedVoices(isEn);
 if(S.voice.name)for(var i=0;i<list.length;i++)if(list[i].name===S.voice.name)return list[i];return list[0]||null;}
function swVoice(){if(!allVoices.length)loadVoices();var list=sortedVoices(isSw);
 if(S.voice.sw)for(var i=0;i<list.length;i++)if(list[i].name===S.voice.sw)return list[i];return list[0]||null;}
/* fallback: respell Kiswahili so an English voice says it the Kiswahili way */
var VMAP={a:"ah",e:"eh",i:"ee",o:"oh",u:"oo"};
function respellWord(w){var lw=w.toLowerCase().replace(/[’']/g,""),syl=[],cur="";
 if(!/[aeiou]/.test(lw))return w;
 for(var k=0;k<lw.length;k++){var c=lw[k];if(VMAP[c]){syl.push(cur+VMAP[c]);cur="";}else cur+=c;}
 if(cur)syl[syl.length-1]+=cur;
 return syl.join("-");}
function respell(t){return t.replace(/[A-Za-zÀ-ÿ’']+/g,respellWord);}
/* split a line into language segments */
function segments(text){var out=[],re=/\u0001([\s\S]*?)\u0002/g,last=0,m;
 while((m=re.exec(text))){if(m.index>last)out.push({x:text.slice(last,m.index),sw:false});out.push({x:m[1],sw:true});last=re.lastIndex;}
 if(last<text.length)out.push({x:text.slice(last),sw:false});
 return out;}
function chunk(arr){var out=[];arr.forEach(function(t){(t.match(/[^.!?]+[.!?]*["”’)]*\s*/g)||[t]).forEach(function(c){c=c.trim();if(c)out.push(c);});});
 /* keep a Kiswahili span from being cut across sentences */
 for(var i=0;i<out.length-1;i++){var o=(out[i].match(/\u0001/g)||[]).length,c=(out[i].match(/\u0002/g)||[]).length;if(o>c){out[i]+=" "+out[i+1];out.splice(i+1,1);i--;}}
 var flat=[];out.forEach(function(line){segments(line).forEach(function(sg){if(sg.x.trim())flat.push(sg);});});return flat;}
var noAdv=false;
function speak(lines,na){if(!synth)return;stopSpeech();noAdv=!!na;VQ=chunk(lines);VI=0;VK++;speaking=true;setTimeout(sayNext.bind(null,VK),60);updateVP();}
function makeUtt(seg){var u,v;
 if(seg.sw){v=swVoice();
  if(v){u=new SpeechSynthesisUtterance(seg.x);u.voice=v;u.lang=v.lang;}
  else{u=new SpeechSynthesisUtterance(respell(seg.x));v=enVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-GB";}}
 else{u=new SpeechSynthesisUtterance(seg.x);v=enVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-GB";}
 u.rate=S.voice.rate*0.96;u.pitch=1;u._v=v;return u;}
function sayNext(k){if(k!==VK||!speaking)return;
 if(VI>=VQ.length){speaking=false;updateVP();onSlideSpoken();return;}
 var u=makeUtt(VQ[VI]),tries=0;
 u.onend=function(){if(k!==VK)return;VI++;setTimeout(function(){sayNext(k);},VQ[VI]&&VQ[VI].sw!==VQ[VI-1].sw?20:140);};
 u.onerror=function(e){if(k!==VK)return;var er=e&&e.error;if(er==="interrupted"||er==="canceled")return;
  if((er==="network"||er==="synthesis-failed"||er==="synthesis-unavailable"||er==="voice-unavailable")&&u._v&&!badVoices[u._v.name]){badVoices[u._v.name]=1;sayNext(k);return;}
  VI++;sayNext(k);};
 synth.speak(u);}
function stopSpeech(){VK++;speaking=false;if(synth)synth.cancel();}
function onSlideSpoken(){if(noAdv)return;var s=slides[S.i];
 if(S.voice.on&&S.voice.auto&&s.t!=="quiz"&&s.t!=="practice"&&s.t!=="capstone"&&S.i<slides.length-1){setTimeout(function(){if(S.voice.on&&!speaking)next();},700);}}
function readCurrent(){if(S.voice.on)speak(speechFor(slides[S.i]));}
function updateVP(){

 if(!on)return;var s=slides[S.i],w=where(s);
 $("vpTitle").textContent=(s.l?"Lesson "+s.l+" · "+label(s):w[1]);
 $("vpSub").innerHTML=speaking?'<span class="wave"><i></i><i></i><i></i></span>Reading aloud':(S.voice.auto?"Paused · auto-advance on":"Paused");
 $("vpPlay").innerHTML=speaking?I.pause:I.play;$("vpPlay").setAttribute("aria-label",speaking?"Pause":"Play this slide");
 $("vpRate").textContent=S.voice.rate+"×";
}
$("voiceBtn").onclick=function(){
 if(!synth){toast("This browser can’t read aloud. Try Chrome or Safari.");return;}
 S.voice.on=!S.voice.on;
 if(S.voice.on){readCurrent();toast(swVoice()?"Listening on. Kiswahili words use the Kiswahili voice.":"Listening on. Install a Kiswahili voice in ⚙ for best Kiswahili.");}else stopSpeech();
 persistLocal();updateVP();};
$("vpPlay").onclick=function(){if(speaking){stopSpeech();updateVP();}else readCurrent();};
$("vpRate").onclick=function(){var r=[0.8,0.9,1,1.15,1.3],i=r.indexOf(S.voice.rate);S.voice.rate=r[(i+1)%r.length];persistLocal();updateVP();if(speaking){var rest=VQ.slice(VI);stopSpeech();VQ=rest;VI=0;VK++;speaking=true;sayNext(VK);updateVP();}};
$("vpSet").onclick=openVoiceSheet;
document.addEventListener("visibilitychange",function(){if(document.hidden&&speaking){stopSpeech();updateVP();}});

function openVoiceSheet(){

 '<div class="field"><label for="swSel">Kiswahili voice (for Kiswahili words and Kenyan names)</label>'+(sw.length?'<select id="swSel">'+voiceOptions(sw,cs)+'</select>':
  '<p class="muted">No Kiswahili voice on this phone yet, so the app spells Kiswahili words out the Kiswahili way for the English voice. For the best sound, add one: Settings → search “Text-to-speech” → Preferred engine: <b>Speech Services by Google</b> → ⚙ → Install voice data → <b>Kiswahili (Kenya)</b>. Then close and reopen Charisma.</p>')+'</div>'+
 '<div class="field"><label>Speed</label><div class="rates">'+rates+'</div></div>'+
 '<div class="toggle"><div><b>Move to the next slide automatically</b><p class="muted">Stops at questions and practice slides so you can answer.</p></div><button id="autoT" aria-pressed="'+S.voice.auto+'" aria-label="Auto-advance"></button></div>'+

function where(s){
 if(s.l)return ["Lesson "+s.l+" of "+NL+" · Module "+(s.m+1),L(s.l).title];
 if(s.t==="module")return ["Module "+(s.m+1)+" of "+D.modules.length,D.modules[s.m].name];
 if(s.t==="capstone")return ["Finish","Capstone"];
 if(s.t==="sources")return ["Finish","Reading & sources"];
 return ["Course","Unlock Your Charisma"];
}
function render(){
 var s=slides[S.i];slideEl.innerHTML=R[s.t](s);
 var w=where(s);$("w1").textContent=w[0];$("w2").textContent=w[1];
 $("count").textContent=(S.i+1)+" / "+slides.length;
 $("barFill").style.width=((S.i+1)/slides.length*100)+"%";
 $("prev").disabled=S.i===0;
 var nx=$("next");nx.disabled=S.i===slides.length-1;nx.textContent=S.i===slides.length-1?"Finished":"Next →";
 updateVP();
}
function go(i,silent){i=Math.max(0,Math.min(slides.length-1,i));var changed=i!==S.i;S.i=i;S.pos=posOf(slides[i]);render();stage.scrollTop=0;if(changed&&!silent)save();if(changed)readCurrent();}
function next(){go(S.i+1);} function prev(){go(S.i-1);}

/* ---------- persistence ---------- */
var dbDoc=null,pushT=null;
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function pushRemote(){if(!dbDoc)return;clearTimeout(pushT);pushT=setTimeout(function(){var c=Object.assign({},S);delete c.voice;dbDoc.set({s:JSON.stringify(c)}).catch(function(){});},1200);}
function save(){S.updated=Date.now();persistLocal();pushRemote();}

/* ---------- events ---------- */
$("next").onclick=next;$("prev").onclick=prev;
slideEl.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.hasAttribute("data-opt")){var s=slides[S.i];S.ans[qid(s.l,s.q)]=+b.getAttribute("data-opt");save();render();
  var fb=$("fb");if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:"nearest",behavior:"smooth"});
  if(S.voice.on)speak(feedbackSpeech(s),true);return;}
 if(b.hasAttribute("data-retry")){delete S.ans[b.getAttribute("data-retry")];save();render();readCurrent();return;}
 if(b.hasAttribute("data-done")){var k=b.getAttribute("data-done");if(S.done[k])delete S.done[k];else S.done[k]=true;save();render();
  if(S.done[k])toast(/m$/.test(k)?"Mission complete. Note it in your journal.":"Nice work. Ticked off.");return;}
 if(b.hasAttribute("data-go")){go(+b.getAttribute("data-go"));}
});
document.addEventListener("keydown",function(e){
 if(!$("drawerScrim").hidden||!$("sheetScrim").hidden){if(e.key==="Escape")closeAll();return;}
 if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev();
});
var tx=0,ty=0,tt=0;
stage.addEventListener("touchstart",function(e){var t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();},{passive:true});
stage.addEventListener("touchend",function(e){if(e.target.closest&&e.target.closest(".tblwrap,.chips"))return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-tt<700){if(dx<0)next();else prev();}},{passive:true});

/* ---------- toast ---------- */
var toastT=null;
function toast(msg,action){var t=$("toast");t.innerHTML="";var sp=document.createElement("span");sp.textContent=msg;t.appendChild(sp);
 if(action){var b=document.createElement("button");b.textContent=action[0];b.onclick=function(){t.hidden=true;action[1]();};t.appendChild(b);}
 t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},action?6000:2600);}

/* ---------- topics drawer ---------- */
function lessonRow(n,cur){var c=correctCount(n),q=L(n).quiz.length,full=c===q&&S.done["l"+n+"m"];
 return '<button class="lbtn'+(cur===n?' here':'')+'" data-jump="'+lessonStart[n]+'" data-find="'+(n+" "+plain(L(n).title)).toLowerCase().replace(/[\u0001\u0002]/g,"").replace(/"/g,"")+'"><span class="n">'+n+'</span><span>'+L(n).title+'</span><span class="s'+(full?' full':'')+'">'+c+'/'+q+(S.done["l"+n+"m"]?' · ✓':'')+'</span></button>';}
function openDrawer(){
 var qc=0,mc=0;order.forEach(function(n){qc+=correctCount(n);if(S.done["l"+n+"m"])mc++;});
 var cur=slides[S.i].l,h='<div class="drow"><h3>Topics</h3><button class="iconbtn" data-close aria-label="Close">'+I.x+'</button></div>'+
 '<label class="search">'+I.search+'<input id="topicFind" type="search" placeholder="Find a topic, e.g. feedback" autocomplete="off"></label>'+
 '<div class="stats"><div class="stat"><b>'+qc+'/'+totalQ+'</b><span>questions right</span></div><div class="stat"><b>'+mc+'/'+NL+'</b><span>field missions done</span></div></div><div id="topicList">';
 D.modules.forEach(function(m,mi){h+='<div class="mgroup"><div class="mhead">Module '+(mi+1)+' · '+m.name+'</div>';
  m.lessons.forEach(function(n){h+=lessonRow(n,cur);});h+='</div>';});
 h+='<div class="mgroup"><div class="mhead">Finish</div><button class="lbtn" data-jump="'+(slides.length-2)+'" data-find="capstone finish"><span class="n">★</span><span>Capstone</span><span class="s"></span></button></div></div>';
 h+='<p class="muted" id="noFind" hidden>No topic matches that. Try another word.</p><button class="danger" id="resetBtn">Reset all progress</button>';
 $("drawer").innerHTML=h;$("drawerScrim").hidden=false;
}
$("menuBtn").onclick=openDrawer;
$("drawerScrim").addEventListener("input",function(e){if(e.target.id!=="topicFind")return;var q=e.target.value.trim().toLowerCase(),any=false;
 Array.prototype.forEach.call(document.querySelectorAll("#topicList .mgroup"),function(g){var vis=0;
  Array.prototype.forEach.call(g.querySelectorAll(".lbtn"),function(b){var ok=!q||b.getAttribute("data-find").indexOf(q)>=0;b.hidden=!ok;if(ok)vis++;});
  g.hidden=!vis;if(vis)any=true;});
 $("noFind").hidden=any;});
$("drawerScrim").addEventListener("click",function(e){
 if(e.target===this||e.target.closest("[data-close]")){closeAll();return;}
 var j=e.target.closest("[data-jump]");if(j){closeAll();go(+j.getAttribute("data-jump"));return;}
 if(e.target.id==="resetBtn"){var b=e.target;
  if(b.dataset.armed){var v=S.voice;S=blank();S.voice=v;S.pos=posOf(slides[0]);save();closeAll();render();stage.scrollTop=0;toast("Progress reset.");}
  else{b.dataset.armed="1";b.textContent="Tap again to erase everything";}}
});
function closeAll(){$("drawerScrim").hidden=true;$("sheetScrim").hidden=true;}

/* ---------- install sheet ---------- */
var deferredPrompt=null,downloads=null;
var isStandalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;});
function openSheet(){
 var h='<div class="drow"><h3>Get Charisma on your phone</h3><button class="iconbtn" data-close aria-label="Close">'+I.x+'</button></div>';
 if(isStandalone){h+='<div class="card"><p><b>You’re using the installed app.</b> It works offline and keeps your place.</p></div>';$("sheet").innerHTML=h;$("sheetScrim").hidden=false;return;}
 if(deferredPrompt)h+='<button class="pill start" id="nativeInstall">'+I.dl+'Install Charisma app</button>';
 if(downloads&&D.pwa)h+='<div class="card"><div class="label">Best · Install as a real app</div><p>Download the app package and put it on GitHub Pages or Netlify (both free). Then install it from Chrome. It appears in your app drawer as <b>Charisma</b>, opens full-screen and works offline.</p><button class="pill start" id="zipBtn">'+I.dl+'Download app package (.zip)</button><p class="muted" id="zipMsg" hidden></p></div>';
 h+='<div class="card"><div class="label">Quick · Add this page to your home screen</div><ol class="howto">'+
 '<li><b>Android (Chrome):</b> open this page in Chrome, tap ⋮ → <b>Install and create shortcut</b> (or <b>Add to Home screen</b>). Name it <b>Charisma</b>.</li>'+
 '<li><b>iPhone (Safari):</b> tap Share → <b>Add to Home Screen</b>, rename it <b>Charisma</b>, then tap Add.</li></ol></div>';
 if(downloads)h+='<div class="card"><div class="label">Offline file</div><p>One file with the whole course. Open it in your browser; it remembers your place on that phone.</p><button class="pill start" id="dlBtn">'+I.dl+'Download Charisma.html</button><p class="muted" id="dlMsg" hidden></p></div>';
 $("sheet").innerHTML=h;$("sheetScrim").hidden=false;
}
$("installBtn").onclick=openSheet;
$("sheetScrim").addEventListener("click",function(e){
 if(e.target===this||e.target.closest("[data-close]")){closeAll();return;}
 if(e.target.closest("#nativeInstall")&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(function(){deferredPrompt=null;closeAll();});return;}
 var rb=e.target.closest("[data-rate]");if(rb){S.voice.rate=+rb.getAttribute("data-rate");persistLocal();openVoiceSheet();updateVP();return;}
 if(e.target.closest("#autoT")){S.voice.auto=!S.voice.auto;persistLocal();openVoiceSheet();updateVP();return;}
 if(e.target.closest("#voiceTest")){speak([plain('Hello. This is how your lessons will sound. In Kiswahili we say, <span lang="sw">Habari yako, Wanjiru? Ana nguvu kama simba.</span>')],true);return;}
 if(e.target.closest("#dlBtn")&&downloads){var m=$("dlMsg");
  downloads.save({filename:"Charisma.html",data:buildFile(false)}).then(function(){m.hidden=false;m.textContent="Saved. Open Charisma.html in Chrome or Safari.";})
  .catch(function(err){m.hidden=false;m.textContent=(err&&err.code==="declined")?"Download cancelled.":"This view can’t save files. Use the home-screen steps instead.";});return;}
 if(e.target.closest("#zipBtn")&&downloads){buildZip();}
});
$("sheetScrim").addEventListener("change",function(e){
 if(e.target.id==="voiceSel"){S.voice.name=e.target.value;persistLocal();}
 if(e.target.id==="swSel"){S.voice.sw=e.target.value;persistLocal();}});

function standaloneHead(pwa){
 var icon=D.pwa?'data:image/png;base64,'+D.pwa.icon192:'';
 return '<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+
 '<meta name="theme-color" content="#2B44D6"><meta name="application-name" content="Charisma"><meta name="mobile-web-app-capable" content="yes">'+
 '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Charisma"><meta name="apple-mobile-web-app-status-bar-style" content="default">'+
 (pwa?'<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">':(icon?'<link rel="icon" href="'+icon+'"><link rel="apple-touch-icon" href="'+icon+'">':''))+
 '<title>Charisma</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">';
}
function buildFile(pwa){
 var css=$("app-css").textContent,data=$("app-data").textContent,js=$("app-js").textContent;
 if(pwa){var d=JSON.parse(data);delete d.pwa;data=JSON.stringify(d).replace(/<\//g,"<\\/");}
 return '<!doctype html><html lang="en"><head>'+standaloneHead(pwa)+'<style id="app-css">'+css+'<\/style></head><body><div id="app"><\/div>'+
 '<script id="app-data" type="application/json">'+data+'<\/script><script id="app-js">'+js+'<\/script></body></html>';
}
function loadJSZip(){return new Promise(function(res,rej){if(window.JSZip)return res(window.JSZip);var s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=function(){res(window.JSZip);};s.onerror=rej;document.head.appendChild(s);});}
function buildZip(){var m=$("zipMsg");m.hidden=false;m.textContent="Building the app package…";
 loadJSZip().then(function(JSZip){var z=new JSZip(),f=z.folder("charisma");
  f.file("index.html",buildFile(true));f.file("manifest.webmanifest",D.pwa.manifest);f.file("sw.js",D.pwa.sw);
  f.file("icon-192.png",D.pwa.icon192,{base64:true});f.file("icon-512.png",D.pwa.icon512,{base64:true});f.file("icon-maskable-512.png",D.pwa.iconMask,{base64:true});
  f.file("README.md",D.pwa.readme);
  return z.generateAsync({type:"blob"});})
 .then(function(blob){return downloads.save({filename:"Charisma-app.zip",data:blob});})
 .then(function(){m.textContent="Saved. Open README.md inside the zip for the steps.";})
 .catch(function(err){m.textContent=(err&&err.code==="declined")?"Download cancelled.":"Couldn’t build the package here. Ask Claude to send the zip in the chat.";});}

/* ---------- offline app support ---------- */
if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]')&&/^https?:$/.test(location.protocol)){
 navigator.serviceWorker.register("sw.js").catch(function(){});}

/* ---------- start ---------- */
render();
if(hadProgress&&S.i>1){var s0=slides[S.i];toast("Welcome back. Picked up at "+(s0.l?"Lesson "+s0.l+": "+plain(L(s0.l).title).replace(/[\u0001\u0002]/g,""):where(s0)[1])+".",["Start over",function(){go(0);}]);}

/* ---------- inside Claude: cloud sync & downloads ---------- */
var C=window.claude;
if(C&&typeof C.use==="function"){
 C.use("downloads").then(function(d){downloads=d||null;}).catch(function(){});
 Promise.all([C.use("db"),C.use("user")]).then(function(r){
  var db=r[0],user=r[1];if(!db||!user)return null;
  return user.id().then(function(id){if(!id)return null;
   dbDoc=db.collection("data/users/"+id).doc("progress");
   return dbDoc.get().then(function(snap){
    var d=snap&&snap.data?snap.data():null,rs=null;
    try{rs=d&&d.s?JSON.parse(d.s):null;}catch(e){}
    if(rs&&(rs.updated||0)>(S.updated||0)){var v=S.voice;S=Object.assign(blank(),rs);if(!rs.v)S.v=1;normalize(S);S.voice=v;persistLocal();render();
     toast("Synced your progress from another device.");}
    else if(S.updated)pushRemote();
   });
  });
 }).catch(function(){});
}
})();
</script></body></html>
