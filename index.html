/* Layout: one-screen slide app — top bar, progress rail, scrolling slide stage, thumb-reach bottom nav. */
:root{

  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1020; --surface:#161A2D; --ink:#ECEEF8; --muted:#9CA2C0; --line:#2A3049;
  --accent:#8FA0FF; --accent-ink:#0D1020; --accent-soft:#1E2550;
  --spot:#F2B43C; --spot-soft:#2C2410;
  --good:#5BD09A; --good-bg:#11301F; --bad:#FF8379; --bad-bg:#3A1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#161A2D; --ink:#ECEEF8; --muted:#9CA2C0; --line:#2A3049;
  --accent:#8FA0FF; --accent-ink:#0D1020; --accent-soft:#1E2550;
  --spot:#F2B43C; --spot-soft:#2C2410;

html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}

button{font:inherit;color:inherit;cursor:pointer}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px}

.kicker{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

.kicker .min{font-variant-numeric:tabular-nums}

h1{font-size:clamp(40px,11vw,68px);line-height:.98;font-weight:800}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 14px var(--display)}

.ba .do{background:var(--good-bg)}.ba .dont{background:var(--bad-bg)}

.ba-head{font:700 13px var(--display);margin-bottom:-4px}
/* quiz */
.qcount{font:700 13px var(--display);color:var(--spot)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-height:56px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .letter{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--bg);font:700 14px var(--display)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .letter{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .letter{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;animation:in .25s ease-out}
.fb strong{font:800 20px var(--display)}
.fb.good{background:var(--good-bg);border:1.5px solid var(--good)}
.fb.good strong{color:var(--good)}
.fb.bad{background:var(--bad-bg);border:1.5px solid var(--bad)}
.fb.bad strong{color:var(--bad)}
.ghost{align-self:flex-start;border:1.5px solid currentColor;background:transparent;border-radius:10px;padding:8px 14px;font-weight:700}
.fb.bad .ghost{color:var(--bad)}
/* practice */
.task{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.check{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.check .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center}
.check[aria-pressed="true"]{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"] .box::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--spot)}
/* cover */
.cover{position:relative;padding-top:8px}
.spot{position:absolute;inset:-20px -16px auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--spot-soft) 0%,transparent 70%);pointer-events:none;z-index:-1}
.cover h1 span{color:var(--accent)}
.start{align-self:flex-start;height:52px;padding:0 22px;font-size:16px}
.mod-n{font:800 96px/0.9 var(--display);color:var(--accent);opacity:.9}

.srcs{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--bg)}
.nav{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 14px}
.nav.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);justify-self:end;min-width:110px}
.nav.prev{justify-self:start}
.nav:disabled{opacity:.4;cursor:default}
#count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(8,10,20,.45);z-index:20;display:flex}
.drawer{background:var(--bg);width:min(92vw,420px);height:100%;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:8px 0 40px rgba(0,0,0,.25)}
.sheet{margin-top:auto;width:100%;max-width:560px;margin-left:auto;margin-right:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 24px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.mhead{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.lbtn{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%}
.lbtn.here{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lbtn .n{font:700 15px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.lbtn .s{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lbtn .s.full{color:var(--good);font-weight:700}
.danger{border:1.5px solid var(--bad);color:var(--bad);background:transparent;border-radius:10px;padding:10px 14px;font-weight:700}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.2)}

@media (max-width:420px){.ba{grid-template-columns:1fr}}
/* brand + voice */
.brandbar{display:flex;align-items:center;gap:8px;padding:10px 16px 0}
.brand{flex:1;min-width:0;font:800 17px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand .d{color:var(--spot)}
.brand small{font:500 13px var(--display);color:var(--muted);margin-left:4px}
.vbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}

.vbtn[aria-pressed="true"]{background:var(--spot-soft);border-color:var(--spot);color:var(--ink)}

.top{padding-top:8px}

@keyframes wv{0%,100%{height:3px}50%{height:12px}}

.field{display:flex;flex-direction:column;gap:6px}

/* explained + kenya */
.miss{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.miss li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.miss li::before{content:"✕";color:var(--bad);font-weight:700}
.ke{border-left:0;position:relative;padding-left:18px}
.ke::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:linear-gradient(var(--ke1) 0 33%,var(--ke2) 33% 66%,var(--ke3) 66%)}
:root{--ke1:#141414;--ke2:#B8322A;--ke3:#167A4F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ke1:#E8E8E8;--ke2:#FF8379;--ke3:#5BD09A}}
:root[data-theme="dark"]{--ke1:#E8E8E8;--ke2:#FF8379;--ke3:#5BD09A}
.ke .label{color:var(--accent)}
.hero-brand{font:800 15px var(--display);color:var(--muted);letter-spacing:.02em}
.hero-brand .d{color:var(--spot)}

/* v3: topics, chips, tables */
.topics{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;flex:none}
.topics svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.toc{display:flex;flex-direction:column;gap:14px}
.tocmod{display:flex;flex-direction:column;gap:6px}

.tocitem:hover{border-color:var(--accent)}
.tocitem .n{font:700 15px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.tocitem .mm{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.card .tocitem{border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 2px;background:transparent}
.card .tocitem:first-child{border-top:0}

.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}

#app{grid-template-columns:minmax(0,1fr)}
#app>*{min-width:0}
#stage,.slide,.chips,.tblwrap{min-width:0;max-width:100%}
</style></head><body><div id="app"></div><script id="app-data" type="application/json">{"modules": [{"name": "Presence", "weeks": "Weeks 1–2", "intro": "People decide how they feel about you before you say much. This module trains the signals you send, with and without words: your first seconds, your introduction, your voice, your inner state and your body.", "lessons": [1, 16, 2, 3, 6, 21]}, {"name": "Speaking", "weeks": "Week 3", "intro": "With steady presence, you need structures for being heard: getting into the conversation, speaking to any crowd, holding attention with stories, making hard ideas simple, and using silence as a tool.", "lessons": [4, 17, 5, 20, 15]}, {"name": "Connection", "weeks": "Week 4", "intro": "Charismatic people make others feel seen, including the quiet ones. This module moves your attention from how you come across to what the other person is experiencing. It is also the fastest cure for self-consciousness.", "lessons": [7, 13, 19, 14]}, {"name": "Hard conversations", "weeks": "Weeks 5–6", "intro": "This is where charisma is tested. One rule runs through all six lessons: stay warm to the person and firm on the issue.", "lessons": [8, 9, 10, 11, 12, 18]}], "lessons": {"1": {"title": "First impression hacks", "min": 15, "idea": ["Impressions form in a blink. In Willis and Todorov’s 2006 study, a 100-millisecond look at a face produced judgments that closely matched those made with unlimited time. Strangers watching under 30 seconds of silent classroom video predicted teachers’ end-of-semester ratings (Ambady and Rosenthal, 1993).", "People judge two things first: <b>warmth<\/b> (are you on my side?) and <b>competence<\/b> (can you deliver?). Warmth is judged first and carries more weight."], "deep": ["Why warmth first? For most of human history, the first question about a stranger was whether they meant us harm. Only after that came the question of whether they were capable. Your listeners still run that check, usually without knowing it.", "This is why very clever people often make weak first impressions. They rush to prove competence (grades, titles, big words) and skip warmth, so they come across as cold or arrogant. People who are warm but show no competence get liked but not followed. Charisma is the two together.", "The good news: first impressions can be revised. Todorov himself stresses that a snap judgment is not a life sentence. The first seconds open the door; your behaviour over the following weeks decides whether it stays open."], "mistakes": ["Leading with your CV, results or title before any friendliness.", "Looking at your phone, notes or the floor as you walk in.", "A “polite” smile that never reaches the eyes."], "src": [["Willis & Todorov (2006)", "https://collaborate.princeton.edu/en/publications/first-impressions-making-up-your-mind-after-a-100-ms-exposure-to-/"], ["Harvard Magazine on warmth & competence", "https://harvardmagazine.com/node/28482"]], "tech": {"name": "The 3-second open", "steps": ["Before entering, think of something you genuinely like about the person or the event. It shows in your face.", "Eyes up, a real smile that reaches the eyes, then their name.", "Lead with warmth, then competence: one friendly line first, credentials later."]}, "ke": [{"t": "In class", "x": "A new teacher walks into Form 2 East on the first day. Teacher A drops the books, writes “Chemistry – Mr. <span lang=\"sw\">Otieno<\/span>” on the board and starts on the syllabus. Teacher B pauses at the door, smiles, says “Good morning, 2 East. I hear this is the class that won the drama festival last term,” then introduces the subject. By break time, students have already decided which teacher they will work hard for."}, {"t": "Student leader", "x": "<span lang=\"sw\">Wanjiru<\/span> is campaigning for school captain. Instead of opening her speech at the assembly with her KCPE marks, she opens with: “Last term I helped the Form Ones find the dining hall on their first night, because I remember how lost I felt.” Warmth first. Then she lists what she will deliver."}, {"t": "Beyond school", "x": "At a job interview in Upper Hill, greet the receptionist by name and with a smile. Panel members often ask the front desk how candidates behaved while waiting."}], "quiz": [{"q": "Which trait do people judge first in a new person, and weigh most?", "o": ["Competence", "Warmth", "Intelligence", "Status"], "a": 1, "why": "Research by Cuddy, Fiske and Glick shows warmth (can I trust you?) is perceived first and accounts for more of the overall judgment than competence."}, {"q": "You walk into a job interview. Which opening makes the strongest first impression?", "o": ["List your credentials straight away", "Smile, use their name, one friendly line, credentials later", "Stay neutral and wait for them to speak", "Apologise for being a little early"], "a": 1, "why": "Warmth first, then competence. Opening with credentials skips the trust question people are already asking."}, {"q": "You are a new class teacher meeting Form 3 for the first time. Which opening builds the most goodwill?", "o": ["Read out the class rules and the punishments", "Smile, greet them, mention something good you’ve heard about the class, then set expectations", "Start teaching immediately to show you’re serious", "Tell them about your university degree"], "a": 1, "why": "Students first ask “Is this teacher on our side?” Answering that with warmth earns you the right to set firm expectations next."}], "drill": "Record a 10-second video introducing yourself. Watch it on mute. Would a stranger rate you warm? Competent? Re-record until both are yes.", "mission": "Use the 3-second open with three people today, including one person you usually ignore (the watchman, the cook, the <span lang=\"sw\">matatu<\/span> conductor). Note how each responds."}, "2": {"title": "Build trust with your voice", "min": 11, "idea": ["Your voice is a trust signal. A Chalmers University study found a relatively slow speaking rate increased trust. Research in Personality and Social Psychology Bulletin found speech rate, falling intonation and pitch all shape how confident you sound, and that sounding confident changes minds.", "Evidence on deep voices and trust is mixed. How your pitch <b>moves<\/b> matters more than how low it is."], "deep": ["When we are nervous, three things happen to the voice: we speed up, our breath goes shallow, and our sentences end on a rising note as if asking for permission. Listeners hear all three as uncertainty, even if every word is correct.", "A falling ending tells the brain “this statement is finished and I stand by it.” A slower pace tells it “what I am saying is worth your time.” Neither requires a big or deep voice. Some of the most commanding speakers are soft-spoken but unhurried.", "Your voice also carries your accent and your first language, and that is fine. Clarity comes from pace, breath and stressing the right words, not from copying a foreign accent."], "mistakes": ["Rushing through the important part to “get it over with.”", "Uptalk: ending statements as if they were questions?", "Speaking in one flat tone with no stressed words."], "src": [["Chalmers study on vocal trust", "https://research.chalmers.se/publication/538646/file/538646_Fulltext.pdf"], ["Vocal confidence & persuasion (PSPB)", "https://journals.sagepub.com/doi/abs/10.1177/0146167218787805"]], "tech": {"name": "Slow, low-stress, land it", "bullet": true, "steps": ["<b>Pace:<\/b> slow down about 10–15% for anything important.", "<b>Downward endings:<\/b> statements fall at the end. A rising “uptalk” ending turns a claim into a question.", "<b>Breath support:<\/b> breathe from the belly; a tight chest makes a thin, rushed voice.", "<b>Stress one word:<\/b> in each sentence, lean on the word that matters most."]}, "ke": [{"t": "Monday assembly", "x": "The deputy principal announces new rules on parade. Said fast and rising (“Phones will be confiscated? From today?”), students hear a suggestion. Said slowly with falling endings (“From today, phones will be confiscated.”), they hear a decision."}, {"t": "Class presentation", "x": "<span lang=\"sw\">Achieng<\/span> presents her Grade 9 CBC project on water harvesting. She practises stressing one word per sentence: “Our school loses <b>half<\/b> its rainwater to the drainage.” The examiner remembers the number."}, {"t": "Beyond school", "x": "On a phone call to a county office, a calm, unhurried voice gets you transferred to the right person more often than an urgent, rushed one."}], "quiz": [{"q": "Which sentence ending makes a statement sound most certain?", "o": ["Rising pitch at the end", "Falling pitch at the end", "Speeding up at the end", "Getting louder at the end"], "a": 1, "why": "Falling intonation signals a finished, confident statement. Rising endings make a statement sound like a question."}, {"q": "You’re about to share the key number in a presentation. What should your pace do?", "o": ["Speed up to show energy", "Slow down slightly", "Stay exactly the same", "Drop to a whisper"], "a": 1, "why": "A slightly slower pace signals importance and has been linked to higher trust. It also gives listeners time to absorb the number."}, {"q": "You are reading the dining hall timetable at assembly and the students keep chatting. What will most likely win their attention?", "o": ["Shout louder and faster", "Slow down, pause, and end each statement on a falling note", "Read it in the same tone but repeat it three times", "Ask a teacher to read it instead"], "a": 1, "why": "Volume and speed signal panic. A slower pace, pauses and firm endings signal authority, and the room quietens to hear you."}], "drill": "Read a newspaper paragraph (Daily Nation or The Standard) aloud and record it. Read it again with falling endings and one stressed word per sentence. Compare the two recordings.", "mission": "In one call, class or meeting today, end every key statement on a downward note."}, "3": {"title": "Confidence wins", "min": 10, "idea": ["Confidence is less a feeling you wait for and more a set of behaviours you practise until the feeling follows.", "Beware quick fixes. The famous “power pose” claim did not hold up: a 200-person replication found no effect on hormones or risk-taking, only on how powerful people <i>said<\/i> they felt. Real confidence comes from preparation, small wins and how you talk to yourself."], "deep": ["Most people think confident people feel no fear. In reality, confident people feel the same racing heart; they just don’t treat it as a stop sign. The body cannot easily tell nerves from excitement, so the label you give the feeling shapes what you do next.", "Confidence is also built from evidence. Each time you do something slightly scary and survive, your brain files it away. A “wins list” lets you read that evidence back before a big moment instead of relying on memory, which tends to replay failures.", "Preparation is the most underrated confidence tool. When the first 30 seconds are rehearsed word for word, you start strong, and a strong start carries you through the parts you didn’t script."], "mistakes": ["Waiting to “feel ready” before speaking up.", "Telling yourself to “calm down,” which rarely works.", "Preparing the whole talk loosely instead of nailing the opening."], "src": [["Ranehill et al. (2015), University of Zurich", "https://www.econ.uzh.ch/dam/jcr:ffffffff-9293-f098-ffff-ffffb6dff410/PressEN.pdf"]], "tech": {"name": "The confidence loop", "steps": ["<b>Prepare your first 30 seconds<\/b> of anything important word for word. A strong start carries momentum.", "<b>Reframe nerves as excitement.<\/b> Same body, kinder label: “I’m excited,” not “calm down.”", "<b>Bank evidence.<\/b> Keep a wins list and read it before high-stakes moments.", "<b>Act first, feel later.<\/b> Speak first or ask the question before you feel ready."]}, "ke": [{"t": "Debate club", "x": "<span lang=\"sw\">Baraka<\/span> has never spoken at an inter-school debate. He writes his opening line word for word (“Madam Speaker, the motion asks whether phones belong in school. I say they already do, in every teacher’s pocket.”) and rehearses it ten times. The opening lands, and the rest flows."}, {"t": "Before KCSE orals or interviews", "x": "<span lang=\"sw\">Njeri<\/span> reads her wins list on the bus: “Led the Form 3 science congress team. Spoke at the PA meeting. Handled the visiting chief.” She walks in reminded that she has done hard things before."}, {"t": "Staffroom", "x": "A young teacher who never speaks in staff meetings decides to ask one question in the first ten minutes. It is small, but next meeting it is easier."}], "quiz": [{"q": "What did the large 2015 replication of “power posing” find?", "o": ["It raised testosterone", "It only changed how powerful people said they felt", "It made people take more risks", "It made people feel less confident"], "a": 1, "why": "Ranehill and colleagues (200 participants) found no change in hormones or behaviour, only in self-reported feelings of power."}, {"q": "Your heart is racing before you speak. Which self-talk helps most?", "o": ["“Calm down.”", "“I’m excited.”", "“Don’t mess this up.”", "“Nobody cares anyway.”"], "a": 1, "why": "Nerves and excitement feel the same in the body. Relabelling the feeling as excitement is easier than forcing calm, and it points you toward the opportunity."}, {"q": "You must represent your class at the County Music Festival verse-speaking finals tomorrow. What is the best use of your last hour of preparation?", "o": ["Skim the whole poem once more", "Rehearse the opening lines until they are automatic", "Avoid thinking about it to stay calm", "Watch other people’s performances online"], "a": 1, "why": "A rehearsed opening gives you a strong start, and that early win steadies your nerves for everything that follows."}], "drill": "Write ten past moments where you handled something hard. That is your wins list. Keep it on your phone.", "mission": "Do one small thing today that scares you a little: ask a question in class or a meeting, or introduce yourself to someone new."}, "6": {"title": "Body language", "min": 15, "idea": ["Your body sends warmth and competence signals alongside your words, and people read posture, gesture and expression within seconds.", "The goal is <b>congruence<\/b>: when your body and words match, people believe you. Norms vary by culture, so match the room you are in."], "deep": ["When words and body disagree, people believe the body. A student who says “I’m sorry” while smirking is not believed. A teacher who says “my door is always open” while typing on a phone is not believed either.", "Open, still and oriented is the safest default. Open means visible hands and no barrier of folded arms or a desk between you. Still means you are not pacing or fidgeting, which reads as nerves. Oriented means your feet and chest point at the person you are talking to.", "Kenyan settings add their own norms. Lowering your eyes slightly with an elder or a principal can be a sign of respect, not weakness. A two-handed handshake or touching your forearm while shaking hands shows extra respect. Read the room and adapt."], "mistakes": ["Hands in pockets or behind the back while addressing a group.", "Turning your back to the class to write on the board while still talking.", "Pacing up and down the aisle without purpose."], "src": [["Scientific American on thin slices", "https://www.scientificamerican.com/article/what-does-the-way-you-walk-say-about-you/"]], "tech": {"name": "Open, still, oriented", "ba": [["Posture", "Upright, shoulders relaxed", "Slouching over a phone"], ["Hands", "Visible, gesturing at waist height", "Pockets, fidgeting, touching face"], ["Orientation", "Feet and torso toward the person", "Body angled at the exit"], ["Eyes", "Hold contact while they speak", "Staring, or scanning the room"], ["Stillness", "Plant your feet for key points", "Pacing, swaying"]]}, "ke": [{"t": "Teaching", "x": "Mr. <span lang=\"sw\">Kiprono<\/span> writes the equation on the board, then turns fully to face the class before explaining it. He stops talking to the board. Questions from the back rows double within a week."}, {"t": "Prefect on duty", "x": "A dormitory captain asks Form Ones to clean up. Leaning on the door frame with arms folded, she sounds bossy. Standing upright, hands visible, facing them, the same words sound like leadership."}, {"t": "Beyond school", "x": "At a church <span lang=\"sw\">harambee<\/span>, the speaker who plants his feet and pauses before announcing the target gets more pledges than the one who paces and rushes."}], "quiz": [{"q": "Which is the strongest signal that you’re fully engaged with someone?", "o": ["Arms folded, listening carefully", "Feet and torso turned toward them", "Nodding constantly", "Glancing at your phone only briefly"], "a": 1, "why": "Orienting your whole body toward someone shows where your attention really is. Constant nodding reads as impatience; any phone glance reads as distraction."}, {"q": "You’re about to make your most important point. What should your body do?", "o": ["Pace to show energy", "Plant your feet and pause", "Put your hands in your pockets", "Turn to look at your slides"], "a": 1, "why": "Stillness signals authority. Planting your feet and pausing tells the audience: this part matters."}, {"q": "A Form 1 student comes to the staffroom to report bullying. What body language helps most?", "o": ["Keep marking books while you listen", "Stop, turn to face them, and give them your full attention", "Stand over them with arms folded", "Tell them to come back later"], "a": 1, "why": "Turning fully toward a nervous student tells them they matter and are safe to speak. Divided attention makes them hold back the important details."}], "drill": "Film yourself telling a 1-minute story. Watch it on mute and note every fidget.", "mission": "In your next conversation, turn your whole body toward the speaker and keep your phone out of sight."}, "4": {"title": "Speak up in any room", "min": 10, "idea": ["In meetings, the longer you wait to speak, the harder it gets, and the more the discussion is shaped without you.", "Structure beats eloquence: a short, organised point lands better than a long, brilliant one. Drop pre-apologies like “this might be a dumb question”; they shift credibility away from you."], "deep": ["Silence compounds. Every minute you wait, the bar for your first comment feels higher, because you now need something “worth” breaking your silence for. Speaking early, even with a small point, removes that pressure for the rest of the meeting.", "PREP works because listeners need to know where you are going. A point first tells them what to listen for; the reason and example make it believable; repeating the point makes it memorable. Rambling speakers lose people not because their ideas are bad but because listeners can’t find the point.", "Hedges and pre-apologies (“I might be wrong, but…”, “Sorry, just a small thing…”) train people to discount you. If you are unsure, say what you are unsure about, specifically, rather than apologising for speaking."], "mistakes": ["Waiting until the end of the meeting when decisions are already made.", "Giving background for two minutes before reaching the point.", "Starting with “Sorry” or “This might be stupid.”"], "src": [["The Villanovan on hedging", "https://villanovan.com/12220/uncategorized/ronzone-rhetoric-in-peril"]], "tech": {"name": "Speak early, speak in PREP", "steps": ["<b>Point:<\/b> say your main idea in one sentence.", "<b>Reason:<\/b> why it’s true or why it matters.", "<b>Example:<\/b> one concrete case or number.", "<b>Point again:<\/b> restate it. Done in under 60 seconds, and try to speak within the first 10 minutes."]}, "ke": [{"t": "Staff meeting", "x": "The principal asks for ideas to improve Form 4 attendance at evening prep. Ms. <span lang=\"sw\">Nafula<\/span> uses PREP: “We should start prep with a 5-minute past-paper challenge. Students come for competition. When I tried it with 4 West, attendance rose from about 30 to 42 in two weeks. A quick challenge at the start will pull students in.”"}, {"t": "Student council", "x": "<span lang=\"sw\">Mutua<\/span> wants the council to push for a later lights-out before exams. Instead of “Sorry, this might be silly, but…”, he opens with “I have one proposal on lights-out.” The room listens."}, {"t": "Beyond school", "x": "In a <span lang=\"sw\">chama<\/span> meeting, the member who speaks early and clearly about the investment plan often sets the direction everyone else reacts to."}], "quiz": [{"q": "What does PREP stand for?", "o": ["Point, Reason, Example, Point", "Prepare, Rehearse, Execute, Pause", "Plan, Respond, Explain, Persuade", "Pause, Repeat, Emphasise, Pause"], "a": 0, "why": "PREP gives you a 60-second structure: Point, Reason, Example, Point again."}, {"q": "Which opener costs you the most credibility?", "o": ["“I have two thoughts.”", "“This might be a dumb question, but…”", "“Building on <span lang=\"sw\">Amina<\/span>’s point…”", "“Quick question:”"], "a": 1, "why": "A pre-apology tells the room to discount you before you start. Signposting (“two thoughts”) and building on others both sound organised."}, {"q": "At a Board of Management meeting, you want to propose a reading corner in the library. When should you speak?", "o": ["Wait until “any other business” at the end", "Early, while the agenda item on facilities is open", "Only if someone asks you directly", "After the meeting, privately with the chair"], "a": 1, "why": "Speaking early while the topic is open shapes the decision. At the end, time is short, people are tired and the budget is already allocated."}], "drill": "Pick a topic you care about. Record a 45-second PREP answer on it. Repeat with three different topics.", "mission": "In your next class, meeting or group call, contribute within the first 10 minutes using PREP."}, "5": {"title": "Storytelling secrets", "min": 13, "idea": ["Stories literally line up minds. Princeton researchers led by Uri Hasson scanned a storyteller and her listeners and found the same brain regions activating, with listeners a few seconds behind. The stronger that coupling, the better listeners understood.", "When the same listeners heard a story in a language they didn’t know, the coupling vanished. Facts tell; stories make people feel and remember."], "deep": ["A fact asks the listener to accept something. A story lets them live through it. That is why students forget a list of revision tips but remember the story of the candidate who studied only from past papers and still scored an A.", "Every good story has tension: something at stake, an obstacle, a moment where it could go either way. Without tension, it is just a report. The turning point is where the lesson lives, so slow down there and add one vivid detail or a line of dialogue.", "Keep stories short and specific. “Last March, at 6 a.m., stuck in a <span lang=\"sw\">matatu<\/span> on <span lang=\"sw\">Thika<\/span> Road” beats “once, when I was travelling.” Specific details make listeners picture the scene, and a pictured scene is what their brains sync to."], "mistakes": ["Starting with long background instead of a scene.", "No tension: everything went smoothly from start to finish.", "Forgetting to say why you told the story."], "src": [["Discover Magazine on speaker–listener coupling", "https://www.discovermagazine.com/study-the-brains-of-storytellers-and-their-listeners-actually-sync-up-13531"], ["Hasson talk abstract", "https://brainimaging.center.uconn.edu/?p=1647"]], "tech": {"name": "The 4-part story spine", "steps": ["<b>Hook:<\/b> a specific time and place. “Last March, at 6 a.m., stuck in a <span lang=\"sw\">matatu<\/span> on <span lang=\"sw\">Thika<\/span> Road…”", "<b>Problem:<\/b> what was at stake and what you wanted.", "<b>Turning point:<\/b> the moment things changed, with one vivid detail or line of dialogue.", "<b>Point:<\/b> the lesson in one sentence, tied to why you’re telling it now. Keep it under 90 seconds."]}, "ke": [{"t": "Motivating a class", "x": "Before mocks, a teacher tells Form 4: “In 2019, a boy in this very classroom was 38th out of 40 at this point. Every evening he did one past paper and marked it himself. I asked him why. He said, ‘Sir, I don’t need to be clever, I need to be familiar.’ He got a B+. You have eight weeks. Get familiar.”"}, {"t": "Prize-giving day speech", "x": "The school captain skips the usual list of thank-yous and tells one story: the night the dormitory flooded and the Form Ones carried mattresses to the hall. Parents remember it long after the event."}, {"t": "Beyond school", "x": "A <span lang=\"sw\">boda boda<\/span> rider who started with a borrowed bike and now owns three makes a stronger case for saving at your <span lang=\"sw\">chama<\/span> than any interest-rate chart."}], "quiz": [{"q": "In Hasson’s studies, what happened when listeners heard a story in a language they couldn’t understand?", "o": ["Their brains synced even more", "The brain coupling disappeared", "They remembered more of it", "The speaker’s brain activity changed"], "a": 1, "why": "Coupling depended on understanding. No shared meaning, no shared brain activity. Clarity matters as much as drama."}, {"q": "Which is the best way to open a story?", "o": ["“So basically, there’s this thing…”", "“Last March at 6 a.m., stuck in traffic on <span lang=\"sw\">Thika<\/span> Road…”", "“Let me give you some background first…”", "“This is going to take a while…”"], "a": 1, "why": "A specific time and place pulls listeners into the scene instantly. Background and warnings make them wait."}, {"q": "You want Form 3s to take career guidance seriously. Which approach is most memorable?", "o": ["Read out university cut-off points", "Tell the story of a former student who changed course choice at the last minute, and what happened", "Hand out a printed brochure", "List ten careers that are in demand"], "a": 1, "why": "A real story with stakes and a turning point lets students feel the consequences. Numbers and lists are easily forgotten."}], "drill": "Build a story bank: five stories (a failure, a win, a funny moment, a lesson from someone else, why you do what you do). Shape each with the spine.", "mission": "Tell one banked story in a real conversation or lesson. Notice the moment people lean in."}, "15": {"title": "The power of the pause", "min": 12, "idea": ["Silence reads as control; fillers read as unreadiness. In a study using real, unscripted speech, “um” and “uh” made speakers seem less ready and less certain, and listeners were less likely to ask them again.", "A University of Michigan study of telephone interviewers found success rates were far higher when fillers were rare. Occasional fillers are normal; the target is fewer, not zero."], "deep": ["We use fillers because silence feels dangerous while speaking. Two seconds of quiet feels like ten to the speaker, but to listeners it feels natural, even thoughtful. Fillers are your brain holding the floor while it finds the next word.", "A pause does the same job without the cost. Before a key point it builds anticipation. After a key point it gives listeners time to absorb it. Before answering a hard question it shows you are thinking rather than panicking.", "Kenyan speech has its own fillers: “<span lang=\"sw\">sasa<\/span>,” “like,” “you know,” “<span lang=\"sw\">ati<\/span>,” “so.” Find yours by recording yourself. You can’t replace a habit you haven’t noticed."], "mistakes": ["Filling every gap with “um,” “<span lang=\"sw\">sasa<\/span>” or “so.”", "Answering a hard question instantly and rambling.", "Rushing past the most important sentence."], "src": [["Disfluency study (eScholarship)", "https://escholarship.org/uc/item/8579j2fh"], ["Daily Pennsylvanian on filler words", "https://www.thedp.com/article/2022/04/filler-words-negative-impact-on-confidence"]], "tech": {"name": "Replace, don’t suppress", "bullet": true, "steps": ["<b>Swap “um” for a silent breath.<\/b> When you feel a filler coming, close your mouth and breathe.", "<b>Pause before key points<\/b> (1 second) so people lean in.", "<b>Pause after key points<\/b> (2 seconds) so it sinks in.", "<b>Pause before hard answers.<\/b> It signals thought, not panic."]}, "ke": [{"t": "Teaching", "x": "“The answer to question 4 is…” (pause) “…photosynthesis.” A one-second pause before the answer makes the whole class look up from their exercise books."}, {"t": "Interview panel", "x": "A Form 4 leaver at a university scholarship interview is asked, “Why should we choose you?” She pauses for two seconds, then answers clearly. The panel notes her composure."}, {"t": "Beyond school", "x": "A pastor who pauses after the key line of a sermon lets the congregation absorb it. One who rushes on loses the moment."}], "quiz": [{"q": "In research on spontaneous speech, frequent “um” and “uh” made speakers seem…", "o": ["More relatable", "Less ready and less certain", "More expert", "More honest"], "a": 1, "why": "Listeners rated disfluent speakers as less ready and less certain, and were less likely to choose to hear from them again."}, {"q": "Someone asks you a hard question. What’s the best first move?", "o": ["Answer instantly to show you know it", "Start with “Um, so, like…”", "Pause for a second, then answer", "Ask them to repeat it, every time"], "a": 2, "why": "A deliberate pause signals that you’re thinking, not panicking, and it replaces the filler you’d otherwise say."}, {"q": "A parent at a PA meeting asks why fees have gone up. What is the strongest start to your reply?", "o": ["“<span lang=\"sw\">Sasa<\/span>, um, you know, the thing is…”", "A brief pause, then a clear first sentence", "Answer immediately before they finish", "Pass the question to the bursar"], "a": 1, "why": "A short pause followed by a clear sentence shows you are calm and in control. Fillers at the start of a sensitive answer sound evasive."}], "drill": "Record a 2-minute talk about your day. Count your fillers. Re-record with a friend clapping each time you say one. Track the count weekly.", "mission": "In one conversation, pause for a full second before answering every question."}, "7": {"title": "Read people like a pro", "min": 15, "idea": ["Read emotions and needs, not lies. A review covering 4,435 people found we tell truth from lies correctly only about 54% of the time, barely better than a coin flip. So skip “spot the liar” tricks like crossed arms or looking away.", "What you <i>can<\/i> read reliably is <b>change<\/b>: when someone shifts from their baseline, something matters to them."], "deep": ["Popular “body language secrets” say crossed arms mean defensiveness and looking away means lying. Research does not support this. Someone may cross their arms because the classroom is cold, or look away because in their culture direct eye contact with an adult is rude.", "Instead, learn each person’s normal. A talkative student who suddenly goes quiet, a colleague who usually jokes but is now formal, a parent whose voice tightens on one topic: these shifts are the real signals.", "Then check, don’t conclude. Your guess about why someone changed may be wrong. Naming what you noticed and asking gently lets them tell you, and shows you were paying attention."], "mistakes": ["Treating one gesture as proof of a feeling.", "Assuming averted eyes mean dishonesty, especially with younger people or in respectful settings.", "Diagnosing instead of asking."], "src": [["Bond & DePaulo (2006)", "https://assets.aclu.org/live/uploads/document/foia/2006-Personality-and-Social-Psychology-Review-Accuracy-of-Deception-Judgements.pdf"]], "tech": {"name": "Baseline, cluster, check", "steps": ["<b>Baseline:<\/b> in the first minutes, notice how they normally talk, sit and gesture.", "<b>Watch for shifts:<\/b> sudden stillness, shorter answers, a changed tone, energy rising on a topic.", "<b>Cluster:<\/b> one signal means little; three together mean something.", "<b>Check, don’t conclude:<\/b> “You lit up when you mentioned the farm. Tell me more.”"]}, "ke": [{"t": "Class teacher", "x": "<span lang=\"sw\">Otieno<\/span> is usually the loudest boy in Form 2. For three days he has sat at the back, not handed in homework and skipped games. Three shifts, one cluster. His teacher says quietly after class: “You’ve seemed far away this week. Is everything okay at home?” It turns out his father lost his job and fees are unpaid."}, {"t": "Guidance and counselling", "x": "A student avoids eye contact while explaining why she missed exams. The counsellor doesn’t assume lying; in many homes, lowering your eyes to an adult is respectful. Instead she watches for changes when specific topics come up."}, {"t": "Beyond school", "x": "In a sales visit, the customer’s questions become more detailed when you mention delivery. That energy shift tells you what really matters to them."}], "quiz": [{"q": "On average, how accurately do people tell lies from truth?", "o": ["About 54%", "About 75%", "About 90%", "About 30%"], "a": 0, "why": "Bond and DePaulo’s review found an average of 54%, only slightly better than guessing. Reading emotions and needs is far more useful than lie-spotting."}, {"q": "A colleague goes quiet and gives short answers whenever the budget comes up. What’s the best response?", "o": ["Assume they’re hiding something", "Ignore it and move on", "Gently name it: “Seems like the budget is a sensitive one?”", "Avoid the topic with them forever"], "a": 2, "why": "A shift from baseline signals something matters. Checking it gently opens the conversation instead of guessing at it."}, {"q": "A usually cheerful Grade 8 learner has been quiet and withdrawn for a week. What should you do?", "o": ["Punish her for not participating", "Assume she is lazy", "Privately mention the change you’ve noticed and ask if she is okay", "Wait for it to pass"], "a": 2, "why": "A clear change from baseline across several days is a real signal. A private, gentle check-in lets her share what is going on."}], "drill": "Watch a TV interview (for example on Citizen or NTV) muted for 3 minutes. Note every visible shift and guess the topic. Rewatch with sound to check.", "mission": "In one conversation, spot an energy shift and check it out loud with a question."}, "13": {"title": "Listen like a leader", "min": 11, "idea": ["Questions win people over. Across three studies, Harvard researchers found people who asked more questions were better liked, and follow-up questions drove the effect. Speed daters who asked more follow-ups got more second dates.", "Most people don’t predict this, so they ask too few. Follow-ups work because they prove you were listening."], "deep": ["Most of us “listen” while preparing our reply. The other person can feel it: our eyes glaze, we jump in too fast, and our response is about us. Real listening means your next question depends on what they just said.", "There are two traps. The first is the topic switch: “Oh, that reminds me of when I…”. The second is the fix: jumping to advice before the person feels heard. Both make the speaker feel unseen, even when meant kindly.", "Paraphrasing is the strongest proof of listening. “So you’re saying the problem isn’t the homework, it’s that you can’t study at home?” If you get it wrong, they correct you, and you understand better. Either way, they feel heard."], "mistakes": ["Planning your reply while they are still talking.", "Jumping to your own similar story.", "Giving advice before asking a single question."], "src": [["Huang et al. (2017), Harvard", "https://dash.harvard.edu/handle/1/35647952"], ["APS summary", "https://psychologicalscience.org/news/minds-business/asking-questions-increases-likability.html"]], "tech": {"name": "The LOOP", "bullet": true, "steps": ["<b>Listen<\/b> fully: no planning your reply, no phone.", "<b>Observe<\/b> the feeling behind the facts.", "<b>Open<\/b> a follow-up on what they just said: “What made you decide that?”", "<b>Paraphrase<\/b> before responding: “So what you’re saying is… right?” Avoid jumping to your own story."]}, "ke": [{"t": "Academic clinic", "x": "A parent says, “My son used to be top five, now he is 25th.” Instead of listing study tips, the class teacher asks, “When did you first notice the change?” then “What else changed around that time?” The real cause (a new boarding house, a difficult roommate) comes out."}, {"t": "Prefects’ meeting", "x": "The school captain paraphrases a Form 3 complaint before responding: “So you feel the Form 4s skip the dining queue and nobody acts?” The Form 3s relax. They were heard."}, {"t": "Beyond school", "x": "A friend says, “I finally quit my job.” The best reply is a follow-up (“What made you decide now?”), not your own story."}], "quiz": [{"q": "Which kind of question most increased how much people were liked in the Harvard study?", "o": ["Introductory questions", "Follow-up questions", "Rhetorical questions", "Questions that switch topic"], "a": 1, "why": "Follow-up questions show responsiveness, that you heard and care, which explained why question-asking increased liking."}, {"q": "A friend says, “I finally quit my job.” What’s the best reply?", "o": ["“I quit mine once too, it was…”", "“What made you decide now?”", "“Wow. Anyway, did you see…”", "“Was that really smart?”"], "a": 1, "why": "A follow-up keeps the focus on them. Jumping to your own story is a topic switch; judging shuts them down."}, {"q": "A student says, “I can’t do Maths, I’ve always been bad at it.” What is the best first response?", "o": ["“Nonsense, everyone can do Maths.”", "“Which topic did it start feeling hard?”", "“I was also bad at Maths in school.”", "“Just practise more.”"], "a": 1, "why": "A specific follow-up helps you find the real gap and shows the student you are taking them seriously. Reassurance, your own story and generic advice all skip listening."}], "drill": "Hold a 10-minute conversation where you ask at least five follow-up questions. Tally them afterwards.", "mission": "In your next disagreement, paraphrase the other person to their satisfaction before giving your view."}, "14": {"title": "Small talk magic", "min": 12, "idea": ["You are more likeable than you think. In the “liking gap” studies, people consistently underestimated how much new conversation partners liked them, after chats of 2 to 45 minutes and for months among new roommates.", "The gap was largest for shy people. Small talk feels worse from the inside than it looks from the outside."], "deep": ["During a conversation, you hear your own awkward pauses and replay the odd thing you said. The other person mostly doesn’t notice; they are busy worrying about their own awkward moments. That mismatch is the liking gap.", "Small talk is not pointless. It is how people check whether you are safe and friendly before sharing anything deeper. The trick is to move gently from facts (“Which school are you from?”) to feelings (“What did you enjoy most there?”) to plans (“What are you hoping to do next year?”).", "Ending well matters too. A warm exit that refers back to something they said (“Good luck with the farm project”) leaves a stronger impression than drifting off."], "mistakes": ["Asking only yes/no questions.", "Opening with a complaint about the event or the weather.", "Leaving abruptly without a warm close."], "src": [["Boothby et al. (2018), Psychological Science", "https://www.psychologicalscience.org/journals/psychological-science/0956797618783714/"]], "tech": {"name": "ARE + thread", "steps": ["<b>Anchor:<\/b> comment on your shared situation. “This queue is moving faster than I expected.”", "<b>Reveal:<\/b> add a small detail about yourself.", "<b>Encourage:<\/b> ask an open question. “What brought you here?”", "<b>Thread and exit:<\/b> follow a hook word (a place, a hobby). Leave warmly: “Great talking about the farm. I’ll let you get some food.”"]}, "ke": [{"t": "Inter-school event", "x": "At the Science Congress, <span lang=\"sw\">Amina<\/span> sits next to a student from another school. Anchor: “Your solar dryer project looked complicated.” Reveal: “Ours almost didn’t work this morning.” Encourage: “How long did yours take to build?” Twenty minutes later they are exchanging numbers."}, {"t": "Parents’ day", "x": "A teacher greets a parent she has never met: “Welcome. Did you find the school easily with the road works?” then “What does Kevin say about Form 2 at home?” The parent opens up about concerns she might otherwise keep quiet about."}, {"t": "Beyond school", "x": "At a wedding reception, “How do you know the couple?” works almost every time. It anchors on the shared situation and invites a story."}], "quiz": [{"q": "According to the “liking gap” research, after talking with someone new you probably…", "o": ["Overestimate how much they liked you", "Underestimate how much they liked you", "Judge it accurately", "Can’t tell at all"], "a": 1, "why": "People consistently underestimated how much their partners liked them and enjoyed the conversation, so you’re likely doing better than you think."}, {"q": "You’re at a wedding reception next to a stranger. Best opener?", "o": ["“So, what do you earn?”", "“How do you know the couple?”", "“Nice weather.” Then silence.", "“I really hate these events.”"], "a": 1, "why": "It anchors on your shared situation and invites a story. Money questions are intrusive; complaints start you on a negative note."}, {"q": "You meet a new teacher in the staffroom on her first day. Which is the best way to start?", "o": ["“Which subjects do you teach?” then move on", "Comment on the shared situation, share a small detail about your own first day, and ask how her morning has been", "Wait for her to introduce herself", "Warn her about difficult classes"], "a": 1, "why": "Anchor, reveal, encourage. You make her feel welcome and invite a real conversation, instead of a quick yes/no exchange or a negative start."}], "drill": "Write 10 openers for places you go weekly: church, staffroom, school gate, market, bus stage.", "mission": "Start three conversations with people you don’t know well this week. Afterwards, rate how much you think they liked you, then remember the gap."}, "8": {"title": "Give tough feedback fast", "min": 17, "idea": ["Kim Scott’s Radical Candor maps feedback on two axes: <b>care personally<\/b> and <b>challenge directly<\/b>. Do both and you get radical candor. Challenge without care is “obnoxious aggression”; care without challenge is “ruinous empathy”, which Scott calls the most common mistake.", "Delay makes feedback harder to give and less useful to hear. Aim for 24–48 hours, in private, one issue at a time."], "deep": ["Many of us were raised on feedback that was either harsh (public shaming, “you are useless”) or absent (“it’s okay, don’t worry”). Neither helps. Harsh feedback makes people defensive; absent feedback lets them keep failing without knowing why.", "SBI works because it replaces judgment with description. “You are careless” is an attack on character, and people defend their character. “In yesterday’s lab practical, you left the Bunsen burner on when you left the bench” describes something they can picture and change.", "Praise needs the same specificity. “Good work” is forgettable. “Your conclusion linked the results back to the hypothesis, which most of the class missed” teaches the student exactly what to repeat, and makes your future corrections more believable."], "mistakes": ["Giving feedback in front of the class or staff.", "Waiting until the end-of-term report to raise a problem from week 2.", "Using labels (“lazy,” “rude,” “careless”) instead of behaviours."], "src": [["First Round Review on Radical Candor", "https://review.firstround.com/radical-candor-the-surprising-secret-to-being-a-good-boss"], ["CCL’s SBI model", "https://wkkfcln.org/a-model-for-giving-feedback/"]], "tech": {"name": "SBI in under 2 minutes", "steps": ["<b>Situation:<\/b> when and where. “In Tuesday’s client call…”", "<b>Behaviour:<\/b> what you saw or heard, not your interpretation. “…you cut the client off twice.”", "<b>Impact:<\/b> the effect. “She went quiet, and we didn’t learn her real constraint.”", "<b>Ask, then stop talking:<\/b> “What was going on for you?”"]}, "ke": [{"t": "Student work", "x": "Instead of writing “Poor work, see me” on an English composition, Mr. <span lang=\"sw\">Mutua<\/span> writes: “In paragraph 2, you changed from past to present tense three times. The reader loses track of when things happened. Rewrite paragraph 2 in past tense only.”"}, {"t": "Head of department to a colleague", "x": "“In Monday’s Form 3 Chemistry lesson, the class was without a teacher for the first 20 minutes. The students were noisy and the deputy had to step in. What happened?” Clear, private and fair."}, {"t": "Prefect to a peer", "x": "A games captain tells a teammate: “At yesterday’s practice, you arrived 30 minutes late. We had to start the drill with nine players. Can we count on you at 4 p.m. sharp?”"}], "quiz": [{"q": "Caring about someone but avoiding hard feedback is called…", "o": ["Radical candor", "Ruinous empathy", "Obnoxious aggression", "Manipulative insincerity"], "a": 1, "why": "Ruinous empathy feels kind but leaves the person without what they need to improve. Kim Scott calls it the most common mistake."}, {"q": "Which is a well-formed SBI statement?", "o": ["“You’re always rude in meetings.”", "“In this morning’s meeting, you cut <span lang=\"sw\">Wanjiku<\/span> off twice, and she stopped contributing.”", "“People think you’re arrogant.”", "“You need to work on your attitude.”"], "a": 1, "why": "It names a specific situation, an observable behaviour and a concrete impact. The others are generalisations or judgments, which trigger defensiveness."}, {"q": "A student copied homework from a classmate. Where and how should you raise it?", "o": ["Announce it in front of the class as a lesson for everyone", "Privately, describing exactly what you noticed and its impact, then asking for their side", "Ignore it this time", "Write “Cheat!” on the exercise book"], "a": 1, "why": "Private, specific feedback protects the student’s dignity and invites honesty. Public shaming triggers defensiveness and often damages the relationship for the whole term."}], "drill": "Write three SBI statements from your past week: one praise, two corrections.", "mission": "Deliver one piece of SBI praise today and one correction this week."}, "9": {"title": "Handle difficult people smartly", "min": 13, "idea": ["Most “difficult” behaviour is a person under threat: feeling disrespected, ignored or out of control. Calm them first; solve second.", "Naming emotions helps. In UCLA brain-imaging research, putting feelings into words reduced activity in the amygdala, the brain’s alarm centre. The researchers note the effect is modest, but it is a reliable first move."], "deep": ["When someone is angry, the thinking part of their brain is partly offline. Explaining policy or arguing facts at that moment rarely works, because they cannot fully hear it yet. Your first job is to bring the temperature down.", "Your own calm is contagious. If you match their volume, you escalate. If you slow your breathing and speak more softly, people usually lower their voice to hear you, often without realising it.", "Look for the need under the behaviour. The parent shouting about a suspension usually needs to feel their child is respected and that they were consulted. Address that need first, and the facts become much easier to discuss."], "mistakes": ["Matching their volume or tone.", "Saying “calm down,” which usually has the opposite effect.", "Defending yourself before acknowledging their feeling."], "src": [["UCLA Health on affect labelling", "https://www.uclahealth.org/news/putting-feelings-into-words-produces-therapeutic-effects-in-the-brain-ucla-neuroimaging-study-supports-ancient-buddhist-teachings"]], "tech": {"name": "The 4 Rs", "steps": ["<b>Regulate yourself:<\/b> slow your breathing and voice. Calm is contagious.", "<b>Recognise the need:<\/b> respect? control? reassurance? information?", "<b>Reflect it back:<\/b> “It sounds like you feel this was decided without you.”", "<b>Redirect to options:<\/b> “What would a good outcome look like for you?”"]}, "ke": [{"t": "Angry parent at the gate", "x": "A father storms in: “Why was my daughter sent home for fees when I paid last week?” The teacher on duty stays calm: “You paid, and she was still sent home. That must be very frustrating.” His voice drops. “Let’s go to the bursar together and check the record.”"}, {"t": "Difficult colleague", "x": "A senior teacher dismisses every idea in staff meetings. A younger teacher meets him privately: “It seems you’ve seen many ideas fail here. What would make this one worth trying, in your view?” He feels respected and starts to engage."}, {"t": "Students", "x": "A Form 4 student shouts, “This school is unfair!” The teacher responds: “You sound really frustrated. Tell me what happened.” Arguing about whether the school is fair can come later."}], "quiz": [{"q": "Naming someone’s emotion out loud (“You sound frustrated”) tends to…", "o": ["Escalate the situation", "Reduce the emotion’s intensity", "Make no difference", "Make them more defensive every time"], "a": 1, "why": "Affect labelling research shows putting feelings into words dampens the brain’s alarm response, helping the other person calm down enough to think."}, {"q": "A customer is shouting at you. What should you do first?", "o": ["Explain the policy clearly", "Regulate yourself: slow your breath and voice", "Raise your voice to be heard", "Hand them to someone else"], "a": 1, "why": "You can’t calm someone else until you’re calm. Your slower voice sets the tone they will start to match."}, {"q": "A parent is shouting at the school gate about their child’s suspension. What is the best first response?", "o": ["“Calm down, sir, there are rules.”", "“I can see you’re very upset about this. Let’s sit down and go through what happened.”", "Call security immediately", "“That’s not my department.”"], "a": 1, "why": "Naming the emotion and offering a calm next step lowers the temperature. “Calm down” and rule-quoting usually escalate an angry parent."}], "drill": "List the three most difficult people in your life. For each, write the need you think drives their behaviour.", "mission": "Next time someone is irritable with you, label their feeling before answering their point."}, "10": {"title": "Say “no” and be likable", "min": 10, "idea": ["A clear no, kindly said, earns more respect than a reluctant yes.", "Wording matters. In studies by Vanessa Patrick and Henrik Hagtvedt, refusals framed as “I don’t” were more persuasive than “I can’t” because they signal conviction. In a pushy-salesperson scenario, “I don’t” refusals were more readily accepted."], "deep": ["Many of us say yes to avoid seeming rude, then do the task badly, late or resentfully. That damages trust more than an honest no would have. People respect those who protect their time, as long as they are kind about it.", "“I can’t” sounds like an obstacle, and obstacles invite problem-solving: “Why can’t you? What if we moved it to Saturday?” “I don’t” sounds like a principle, and people tend to respect principles.", "Keep reasons short. One clear reason is believable. Five excuses sound like you are hiding the real one, and each excuse gives the other person something to argue with."], "mistakes": ["Saying yes, then quietly not delivering.", "Over-explaining with a list of excuses.", "Saying no coldly, with no appreciation or alternative."], "src": [["Patrick & Hagtvedt on persuasive refusal", "https://www.bauer.uh.edu/vpatrick/docs/HowtoSayNo.doc"], ["Gulf News summary", "https://gulfnews.com/lifestyle/why-you-should-learn-to-say-no-1.2047140"]], "tech": {"name": "The warm no", "steps": ["<b>Appreciate:<\/b> “Thanks for thinking of me.”", "<b>Decline clearly:<\/b> “I’m going to say no to this one,” or a rule: “I don’t take on new projects mid-term.”", "<b>Keep reasons short:<\/b> one reason, not five excuses. Excuses invite negotiation.", "<b>Offer an alternative (optional):<\/b> “I can review the draft on Friday.” To a boss: “Which of A or B should I drop?”"]}, "ke": [{"t": "Extra duties", "x": "The deputy asks Ms. <span lang=\"sw\">Achieng<\/span> to be patron of a fourth club. She says: “Thank you for trusting me with it. I’m going to say no; I already run three clubs and want to do them well. Mr. <span lang=\"sw\">Kamau<\/span> mentioned he’d like a club. Shall I ask him?”"}, {"t": "Peer pressure", "x": "Friends invite a Form 4 student to sneak out of school on a Friday. “I don’t sneak out” is firmer, and harder to argue with, than “I can’t, the teachers might catch me.”"}, {"t": "Principal’s request", "x": "Asked to also teach Form 1 Geography, a teacher replies: “Yes, I can. To fit it in, should I drop the remedial Maths lessons or the debate club?” The principal sees the trade-off and decides."}], "quiz": [{"q": "Which refusal did researchers find more persuasive?", "o": ["“I can’t.”", "“I don’t.”", "“Maybe later.”", "“I’ll try.”"], "a": 1, "why": "“I don’t” signals a settled rule tied to who you are, so people see conviction. “I can’t” sounds like an obstacle that could be negotiated."}, {"q": "Your boss adds a task when you’re already at full capacity. Best response?", "o": ["“Sure!” then quietly miss deadlines", "“Yes, I can do this. Which of A or B should I drop to make room?”", "“No, I’m too busy.”", "Say nothing and hope it goes away"], "a": 1, "why": "It stays cooperative while making the trade-off visible, so your boss decides the priority instead of you silently failing."}, {"q": "A classmate keeps asking to copy your homework. What is the most effective response?", "o": ["“I can’t today, my book is at home.”", "“I don’t share my homework, but I can explain question 3 at break.”", "Let them copy to keep the peace", "Report them without saying anything"], "a": 1, "why": "“I don’t” states a clear rule, and offering to explain keeps you kind and helpful. An excuse invites them to ask again tomorrow."}], "drill": "Write five “I don’t” rules that reflect your priorities.", "mission": "Say one warm no this week to something you’d normally accept out of guilt."}, "11": {"title": "Interrupt smoothly", "min": 10, "idea": ["Sometimes interrupting is the respectful thing: a meeting is drifting, someone is monologuing, or a mistake is about to be made.", "The skill is making the interruption feel like a service, not a grab."], "deep": ["In many Kenyan settings, interrupting an elder or a senior is considered rude, so people stay quiet even when a discussion is going badly off track. The result is long meetings and poor decisions. Interrupting well is a way of showing respect for everyone’s time.", "A good interruption has three parts. Saying the person’s name makes them pause naturally. A quick appreciation or summary shows you were listening and that you value their point. The bridge explains why you are cutting in, so it feels purposeful.", "Being interrupted is the other half. If someone cuts you off, calmly holding your ground while promising them a turn keeps your authority without starting a fight."], "mistakes": ["Raising your voice to talk over someone.", "Interrupting with an unrelated point.", "Giving up your point completely when interrupted."], "src": [], "tech": {"name": "Name, appreciate, bridge", "steps": ["<b>Use their name:<\/b> people pause when they hear it.", "<b>Appreciate or summarise:<\/b> “<span lang=\"sw\">Kamau<\/span>, that’s a great point about costs…”", "<b>Bridge with purpose:<\/b> “…can I connect it to the deadline before we lose time?”", "<b>If you’re interrupted:<\/b> “Hold on, let me finish this thought, then I want to hear yours.”"]}, "ke": [{"t": "Staff meeting", "x": "A senior teacher has spent ten minutes on old complaints about the timetable. The HOD says: “Mr. <span lang=\"sw\">Kamau<\/span>, you’ve raised something important about the double lessons. Can we note it, and come back to it once we’ve settled the exam dates, since we have 15 minutes left?”"}, {"t": "Group work", "x": "In a CBC group project, one learner dominates. The group leader says: “<span lang=\"sw\">Njeri<\/span>, that’s a good idea for the model. Let’s hear from Brian and Faith too before we decide.”"}, {"t": "In class", "x": "A student starts telling a long, unrelated story. The teacher says: “Kevin, that sounds like a good story. Tell me at break. Right now, let’s finish question 5.”"}], "quiz": [{"q": "What’s the first step in name–appreciate–bridge?", "o": ["Raise your voice", "Say the person’s name", "Talk over them until they stop", "Wait until they finish completely"], "a": 1, "why": "Hearing their own name makes people pause naturally, giving you an opening without a power struggle."}, {"q": "Someone cuts you off mid-point. Best response?", "o": ["Stop and never finish", "Talk louder over them", "“Hold on, let me finish this thought, then I want to hear yours.”", "Leave the conversation"], "a": 2, "why": "It holds your ground calmly while promising them a turn: firm on the issue, warm to the person."}, {"q": "During a group discussion in class, one learner keeps taking over. As group leader, what do you say?", "o": ["“Be quiet, you talk too much.”", "“Good point, <span lang=\"sw\">Otieno<\/span>. Let’s hear what Faith and Brian think too.”", "Say nothing so as not to offend", "Tell the teacher after class"], "a": 1, "why": "Name, appreciate, bridge. It respects <span lang=\"sw\">Otieno<\/span> while opening space for others. Harsh words embarrass him; silence lets the problem continue."}], "drill": "Script three interruption lines for the meeting or class you attend most often.", "mission": "In one meeting or group discussion, redirect a tangent using name–appreciate–bridge."}, "12": {"title": "Defuse any conflict", "min": 15, "idea": ["Conflict escalates when each side feels unheard. It cools when both sides feel understood, even if they still disagree.", "Separate the person from the problem, and <b>positions<\/b> (what they demand) from <b>interests<\/b> (why they want it). Interests usually leave room for a deal; positions rarely do."], "deep": ["In a heated argument, both sides repeat their positions louder. “We want the field on Saturday!” “No, we need it on Saturday!” Neither moves, because each feels the other is not listening.", "Interests break the deadlock. Ask why: the football team needs Saturday because the county match is next week; the athletics team needs it because the track is only marked on weekends. Now there are options, like football in the morning and athletics in the afternoon.", "Timing matters. When emotions are high, it is better to pause and agree when to continue than to push for a solution. “This matters too much to rush. Can we pick it up tomorrow at 10?” is a sign of maturity, not weakness."], "mistakes": ["Bringing up old grievances in the middle of a new conflict.", "Arguing about who is right instead of what to do next.", "Trying to solve it while everyone is still shouting."], "src": [], "tech": {"name": "The de-escalation ladder", "steps": ["<b>Lower the temperature:<\/b> slower voice, softer volume, sit down if standing.", "<b>Label emotions:<\/b> “It seems like you’re frustrated because this keeps happening.”", "<b>Find the shared goal:<\/b> “We both want the event to go well.”", "<b>Ask for interests, then co-create options:<\/b> “What matters most to you here?” Agree a small next step. Too heated? “Can we pick this up tomorrow at 10?”"]}, "ke": [{"t": "Dormitory dispute", "x": "Two Form 3 girls fight over a locker. The dorm captain sits them down: “You both want somewhere safe for your things. What matters most to each of you?” One wants the locker near her bed; the other wants one with a working lock. They swap and fix the lock."}, {"t": "Teachers sharing a lab", "x": "Biology and Chemistry both want the lab on Thursday afternoons. Their HOD asks about interests: Biology needs it for dissections that take time; Chemistry needs it before Friday’s practice paper. They split the slot and swap on alternate weeks."}, {"t": "Beyond school", "x": "In a <span lang=\"sw\">chama<\/span> dispute over loan repayment, the chair names the shared goal first: “We all want this group to still be standing in five years.” Then the conversation turns to options."}], "quiz": [{"q": "What’s the difference between a position and an interest?", "o": ["A position is what someone demands; an interest is why they want it", "A position is why; an interest is what", "They mean the same thing", "Positions are emotional; interests are logical"], "a": 0, "why": "Two people can hold opposite positions but share interests. Asking “why does that matter to you?” uncovers room to agree."}, {"q": "A disagreement is heating up. What’s the best move?", "o": ["Push your argument harder", "State the goal you both share", "Bring up past grievances", "Walk out without a word"], "a": 1, "why": "Naming the shared goal moves you from opponents to collaborators facing the same problem."}, {"q": "Two clubs both demand the school hall for Friday afternoon. As patron, what should you do first?", "o": ["Give it to whichever club asked first", "Ask each club why they need Friday specifically", "Cancel both bookings", "Let them argue it out"], "a": 1, "why": "Asking about interests often reveals a solution (different times, different rooms) that a first-come rule or cancelling would miss."}], "drill": "Recall a past argument. Rewrite it using the ladder: what would you say at each step?", "mission": "In your next disagreement, state the shared goal out loud before arguing your position."}, "16": {"title": "Introduce yourself anywhere", "min": 15, "idea": ["A self-introduction is the first impression you can plan in advance. A good one answers three questions the listener is silently asking: <b>Who are you?<\/b> (name and role), <b>Why should I care?<\/b> (what you bring that matters to them), and <b>Are you safe to be around?<\/b> (one warm or human detail).", "Lesson 1 applies here: warmth first, then competence. Your introduction is short, so every sentence has to do a job."], "deep": ["People keep very little from an introduction: your name, one fact, and how you made them feel. Twelve facts get forgotten, but one well-chosen fact gets repeated: “That’s the new teacher who coaches drama.”", "What you stress should change with who is listening. A boss wants reliability. Colleagues want someone easy to work with. Students want fairness and control. A panel wants fit. A stranger wants to feel comfortable, not cornered.", "Say your name slowly, then say it again at the end. Nerves make people rush their own name, and it is the one thing everyone needs to catch."], "mistakes": ["Reciting your CV: every school, every year, every certificate.", "Rushing your name, or saying it only once.", "Opening with an apology: “I’m not good at this, but…”", "Using the same introduction for the principal, the staffroom and Form 1.", "Asking a stranger personal questions too early: where they come from, their age, whether they are married.", "Ending with “So… yeah. That’s all.”"], "src": [["Harvard Magazine on warmth & competence", "https://harvardmagazine.com/node/28482"]], "tech": {"name": "Present, Past, Future, plus a hook", "steps": ["<b>Present:<\/b> your name and role.", "<b>Past:<\/b> one relevant thing that brought you here, chosen for this audience.", "<b>Future:<\/b> what you look forward to, or how you can help.", "<b>Hook:<\/b> one human detail people can remember.", "<b>Close:<\/b> your name again, and a clear ending. Short version (30 seconds): Present, Future, Hook. Long version (2 minutes): all five, with one short story in the Past part. With a stranger: Present, then a question back to them."]}, "more": {"label": "Meeting a stranger", "h": "Meeting a stranger", "blocks": [{"p": ["The rule for both men and women is the same: start from the situation you are both in, exchange names, and let the other person decide how far the conversation goes."]}, {"card": {"t": "Meeting a man", "x": "At a teachers’ workshop in <span lang=\"sw\">Nakuru<\/span>, waiting for the session to start: “<span lang=\"sw\">Habari yako<\/span>? I’m John. I teach English in <span lang=\"sw\">Machakos<\/span>. Is this your first time at one of these KICD workshops?” Offer a handshake as you say your name. Context opener, name, and an easy question. Men often warm up through a shared task or topic, such as the workshop, the venue or last night’s match."}}, {"card": {"t": "Meeting a woman", "x": "At the same workshop, seated next to you: “Good morning. I’m John. I teach English in <span lang=\"sw\">Machakos<\/span>. Do you know if they’re sharing the notes after the session?” Same structure, with three extra courtesies that make a woman you have just met comfortable:"}, "bullets": ["<b>Let her set the handshake.<\/b> If she offers her hand, shake it warmly. If she only nods, nod back.", "<b>Keep it about the shared situation.<\/b> Comment on the workshop or the event. Avoid comments on her looks, and avoid personal questions such as her age, whether she is married, or her phone number.", "<b>Make leaving easy for her.<\/b> Short answers, or her eyes going back to her phone, mean she would rather stop. Close politely: “Nice meeting you, Faith. Enjoy the session.”"]}, {"p": ["A woman introducing herself to a man she doesn’t know can use the same formula. Keep it in a public, shared setting, and you decide how much to share about where you work or live."]}]}, "ke": [{"t": "New boss", "x": "First meeting with the principal: “Good morning, Madam Principal. I’m John <span lang=\"sw\">Karani<\/span>, posted here for English and Literature. At my last school I helped raise the Form 4 English mean from 6.2 to 7.4 over two years, mostly through weekly composition clinics. I’d like to understand your priorities for English, and I’m ready to take on a club where you need help.” One number, an offer of help, and a question about her goals."}, {"t": "New colleagues", "x": "Staff briefing: “Good morning, colleagues. I’m John, the new English and Lit teacher. I’ve come from a day school, so boarding is new to me. Please be patient while I learn how things run here. I enjoy drama, so if anyone needs help preparing students for the festival, count me in. Again, I’m John. Thank you.” Humble, useful, and remembered through the drama offer."}, {"t": "Students", "x": "First lesson with Form 3 West: “Good morning, 3 West. I’m Mr. <span lang=\"sw\">Karani<\/span>, your English teacher this year. Three things about how I work. One: I start on time and end on time. Two: every question is welcome here. Three: we’ll read <i>Blossoms of the Savannah<\/i> like a story, not a punishment. And one thing about me: no student has ever beaten me at draughts. That record is open for challengers. Now, let me learn your names.”"}, {"t": "Interview panel", "x": "“Tell us about yourself.” “My name is John <span lang=\"sw\">Karani<\/span>, a trained teacher of English and Literature with four years’ experience. Three things make me a fit for this post. First, results: my Form 4 English mean rose by over one point. Second, co-curricular: I’ve taken drama students to county level. Third, I’m confident with CBC assessment and have trained colleagues on it. I’m looking to grow into a head of department role, and I’d like it to be here.” Under 90 seconds."}], "quiz": [{"q": "You sit next to a woman you don’t know at a seminar. Which opener is best?", "o": ["“You look too young to be a teacher.”", "“Good morning, I’m John. Do you know if they’re sharing the notes later?”", "“Where are you from? Are you married?”", "Say
